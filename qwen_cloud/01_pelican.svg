<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Pelican riding a bicycle</title>
  <desc id="dsc">A cartoon pelican pedals a red bicycle along a road: wheels spin, the crank
  turns, legs pump, the pouch wobbles and scenery scrolls past.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc0ee"/>
      <stop offset=".55" stop-color="#bde9f8"/>
      <stop offset="1" stop-color="#fdf0d0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset=".75" stop-color="#ffd85f"/>
      <stop offset="1" stop-color="#ffc139"/>
    </radialGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7583"/>
      <stop offset="1" stop-color="#3c4350"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccd6e1"/>
    </linearGradient>
    <linearGradient id="billG" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#ffc564"/>
      <stop offset="1" stop-color="#f08629"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd89a"/>
      <stop offset="1" stop-color="#f3a24d"/>
    </linearGradient>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <g transform="translate(98,84)">
    <g stroke="#ffd85f" stroke-width="6" stroke-linecap="round" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <line x1="0" y1="-52" x2="0" y2="-66"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(45)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(90)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(135)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(180)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(225)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(270)"/>
      <line x1="0" y1="-52" x2="0" y2="-66" transform="rotate(315)"/>
    </g>
    <circle r="38" fill="url(#sun)"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" from="840 0" to="-280 0" dur="42s" begin="-6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="92" rx="44" ry="20"/><ellipse cx="32" cy="80" rx="28" ry="20"/><ellipse cx="-32" cy="84" rx="22" ry="15"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-200 0" dur="30s" begin="-18s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="150" rx="34" ry="15"/><ellipse cx="24" cy="142" rx="22" ry="15"/><ellipse cx="-24" cy="145" rx="17" ry="12"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="880 0" to="-320 0" dur="55s" begin="-34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="58" rx="30" ry="14"/><ellipse cx="22" cy="50" rx="20" ry="14"/><ellipse cx="-22" cy="52" rx="16" ry="11"/>
    </g>
  </g>

  <!-- ============ FAR HILLS ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="26s" repeatCount="indefinite"/>
    <g fill="#a4d3a9">
      <path d="M0,392 Q70,330 150,376 Q210,410 280,368 Q350,326 430,380 Q490,414 560,372 Q630,330 710,378 Q760,404 800,392 L800,440 L0,440 Z"/>
      <path transform="translate(800,0)" d="M0,392 Q70,330 150,376 Q210,410 280,368 Q350,326 430,380 Q490,414 560,372 Q630,330 710,378 Q760,404 800,392 L800,440 L0,440 Z"/>
    </g>
  </g>

  <!-- ============ MID HILLS ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="15s" repeatCount="indefinite"/>
    <g fill="#7fc189">
      <path d="M0,410 Q60,368 130,400 Q190,426 250,396 Q310,366 380,402 Q440,428 500,398 Q560,368 620,402 Q680,428 740,400 Q775,386 800,410 L800,440 L0,440 Z"/>
      <path transform="translate(800,0)" d="M0,410 Q60,368 130,400 Q190,426 250,396 Q310,366 380,402 Q440,428 500,398 Q560,368 620,402 Q680,428 740,400 Q775,386 800,410 L800,440 L0,440 Z"/>
    </g>
  </g>

  <!-- ============ HEDGE + TREES (fast parallax) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="9s" repeatCount="indefinite"/>
    <g stroke="#8a6a4a" stroke-width="10" stroke-linecap="round">
      <line x1="250" y1="418" x2="250" y2="336"/><line x1="650" y1="418" x2="650" y2="342"/>
      <line x1="1050" y1="418" x2="1050" y2="336"/><line x1="1450" y1="418" x2="1450" y2="344"/>
    </g>
    <g fill="#4f9a63">
      <g><circle cx="250" cy="326" r="32"/><circle cx="228" cy="342" r="22"/><circle cx="274" cy="342" r="21"/></g>
      <g><circle cx="650" cy="332" r="28"/><circle cx="632" cy="346" r="19"/><circle cx="670" cy="346" r="18"/></g>
      <g><circle cx="1050" cy="326" r="32"/><circle cx="1028" cy="342" r="22"/><circle cx="1074" cy="342" r="21"/></g>
      <g><circle cx="1450" cy="334" r="27"/><circle cx="1432" cy="348" r="18"/><circle cx="1470" cy="348" r="17"/></g>
    </g>
    <rect x="0" y="412" width="1600" height="22" fill="#5f9d6c"/>
    <g fill="#548c60">
      <circle cx="70" cy="410" r="22"/><circle cx="102" cy="404" r="28"/><circle cx="136" cy="412" r="20"/>
      <circle cx="470" cy="408" r="24"/><circle cx="502" cy="402" r="30"/><circle cx="536" cy="410" r="22"/>
      <circle cx="870" cy="410" r="22"/><circle cx="902" cy="404" r="28"/><circle cx="936" cy="412" r="20"/>
      <circle cx="1270" cy="408" r="24"/><circle cx="1302" cy="402" r="30"/><circle cx="1336" cy="410" r="22"/>
    </g>
  </g>

  <!-- ============ ROAD ============ -->
  <rect x="0" y="430" width="800" height="8" fill="#97a0ac"/>
  <rect x="0" y="436" width="800" height="64" fill="url(#asphalt)"/>
  <line x1="-80" y1="470" x2="880" y2="470" stroke="#f4e4b6" stroke-width="7"
        stroke-dasharray="46 34" stroke-linecap="butt">
    <animate attributeName="stroke-dashoffset" from="0" to="80" dur=".5s" repeatCount="indefinite"/>
  </line>

  <!-- ============ SPEED LINES + DUST ============ -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".6">
    <line x1="150" y1="188" x2="222" y2="188">
      <animateTransform attributeName="transform" type="translate" values="70 0;-150 0" dur=".85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur=".85s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="252" x2="228" y2="252">
      <animateTransform attributeName="transform" type="translate" values="70 0;-150 0" dur=".85s" begin="-.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur=".85s" begin="-.3s" repeatCount="indefinite"/>
    </line>
    <line x1="160" y1="316" x2="216" y2="316">
      <animateTransform attributeName="transform" type="translate" values="70 0;-150 0" dur=".85s" begin="-.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur=".85s" begin="-.55s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#efe8d6">
    <circle cx="268" cy="426" r="5">
      <animate attributeName="r" values="3;12;17" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="268;190" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="426;412" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;.3;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="268" cy="426" r="5">
      <animate attributeName="r" values="3;12;17" dur="1.1s" begin="-.55s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="268;196" dur="1.1s" begin="-.55s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="426;414" dur="1.1s" begin="-.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;.25;0" dur="1.1s" begin="-.55s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ RIDER + BICYCLE (gentle bob) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4; 0 0; 0 -2; 0 0" dur=".8s" repeatCount="indefinite"/>

    <!-- shadow -->
    <ellipse cx="410" cy="434" rx="196" ry="11" fill="#000" opacity=".18"/>

    <!-- FAR LEG (behind bike, opposite pedal phase) -->
    <g transform="translate(-12,-10)" opacity=".95">
      <polyline fill="none" stroke="#d9862b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
                points="356,242 416,298 388,375 402,381">
        <animate attributeName="points" dur=".8s" repeatCount="indefinite"
          values="356,242 416,298 388,375 402,381;
                  356,242 431,276 408,355 422,361;
                  356,242 420,293 428,375 442,381;
                  356,242 395,314 408,395 422,401;
                  356,242 416,298 388,375 402,381"/>
      </polyline>
    </g>

    <!-- FAR CRANK -->
    <g transform="translate(408,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="-20" y2="0" stroke="#2f3740" stroke-width="6" stroke-linecap="round"/>
        <rect x="-33" y="-4.5" width="23" height="9" rx="3" fill="#20262c"/>
      </g>
    </g>

    <!-- WHEELS -->
    <g transform="translate(275,368)">
      <circle r="62" fill="none" stroke="#22262b" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#dfe5ec" stroke-width="3"/>
      <g stroke="#aeb7c2" stroke-width="2.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".45s" repeatCount="indefinite"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/>
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-37" y1="37" x2="37" y2="-37"/>
      </g>
      <circle r="11" fill="#6b7480"/>
      <circle r="11" fill="none" stroke="#c3cbd4" stroke-width="3" stroke-dasharray="3 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".45s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#39424c"/>
    </g>
    <g transform="translate(548,368)">
      <circle r="62" fill="none" stroke="#22262b" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#dfe5ec" stroke-width="3"/>
      <g stroke="#aeb7c2" stroke-width="2.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".45s" repeatCount="indefinite"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/>
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-37" y1="37" x2="37" y2="-37"/>
      </g>
      <circle r="6" fill="#55606d"/>
      <circle cx="-40" cy="-33" r="3.4" fill="#ff6b6b"/>
    </g>

    <!-- FRAME -->
    <g stroke="#c0392b" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M408,375 L356,262"/>
      <path d="M356,262 L516,250"/>
      <path d="M408,375 L508,276"/>
      <path d="M408,375 L275,368"/>
      <path d="M356,262 L275,368"/>
      <path d="M516,250 L505,286"/>
      <path d="M507,281 C520,308 534,336 548,368" stroke-width="8"/>
    </g>
    <!-- chain -->
    <path d="M277,357 L397,353 M277,379 L397,395" stroke="#78828e" stroke-width="4" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur=".35s" repeatCount="indefinite"/>
    </path>
    <!-- chainring -->
    <g transform="translate(408,375)">
      <circle r="21" fill="#59636f"/>
      <circle r="21" fill="none" stroke="#9aa5b1" stroke-width="3.5" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#39424c"/>
    </g>
    <!-- seat post + saddle -->
    <path d="M356,262 L352,246" stroke="#8a949f" stroke-width="7" stroke-linecap="round"/>
    <path d="M326,246 Q354,234 380,244 Q356,258 326,254 Z" fill="#3a4250"/>
    <!-- stem + bars -->
    <path d="M516,252 L507,228" stroke="#8a949f" stroke-width="7" stroke-linecap="round"/>
    <path d="M507,228 C530,217 558,226 562,245" stroke="#3a4250" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="562" cy="246" r="6" fill="#f4d03f"/>

    <!-- ===== PELICAN ===== -->
    <g>
      <!-- tail -->
      <path d="M252,192 L188,168 Q208,196 194,216 L252,224 Z" fill="#c5cedb"/>
      <!-- body -->
      <ellipse cx="318" cy="206" rx="82" ry="56" transform="rotate(-10 318 206)" fill="url(#feather)" stroke="#b9c3d0" stroke-width="2"/>
      <!-- belly shading -->
      <path d="M262,240 Q320,268 386,232" stroke="#b9c3d0" stroke-width="3" fill="none" opacity=".7"/>

      <!-- head + neck group (gentle nod) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 368 182; 3 368 182; 0 368 182; -2 368 182; 0 368 182"
                          dur="1.6s" repeatCount="indefinite"/>
        <!-- neck -->
        <path d="M366,182 C374,140 404,118 440,110" stroke="#f3f6fa" stroke-width="32"
              stroke-linecap="round" fill="none"/>
        <!-- scarf -->
        <path fill="#e8504a" d="M440,126 C414,120 394,140 368,132 C380,152 406,146 436,142 Z">
          <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
            values="M440,126 C414,120 394,140 368,132 C380,152 406,146 436,142 Z;
                    M440,126 C416,126 396,128 372,142 C388,160 408,146 436,142 Z;
                    M440,126 C414,120 394,140 368,132 C380,152 406,146 436,142 Z"/>
        </path>
        <!-- head -->
        <ellipse cx="452" cy="107" rx="26" ry="23" fill="url(#feather)" stroke="#b9c3d0" stroke-width="2"/>
        <!-- head tuft -->
        <path d="M436,88 Q428,70 442,62 Q446,76 454,80 Z" fill="#c5cedb"/>
        <!-- gular pouch (wobbles) -->
        <path fill="url(#pouchG)" d="M476,112 C512,118 556,118 590,112 C560,150 508,150 476,112 Z">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            values="M476,112 C512,118 556,118 590,112 C560,150 508,150 476,112 Z;
                    M476,112 C512,118 556,118 590,112 C560,168 508,164 476,112 Z;
                    M476,112 C512,118 556,118 590,112 C560,150 508,150 476,112 Z"/>
        </path>
        <!-- upper bill -->
        <path fill="url(#billG)" stroke="#d9741f" stroke-width="1.5"
              d="M472,96 C514,102 560,106 594,110 C560,118 512,118 472,114 Z"/>
        <path d="M478,104 C516,108 556,111 588,113" stroke="#d9741f" stroke-width="1.6" fill="none" opacity=".7"/>
        <!-- nostril -->
        <ellipse cx="486" cy="101" rx="4" ry="2" fill="#c9681a" opacity=".8"/>
        <!-- eye -->
        <circle cx="462" cy="98" r="8.5" fill="#fff"/>
        <circle cx="464" cy="99" r="4.2" fill="#22262b"/>
        <circle cx="465.6" cy="96.6" r="1.6" fill="#fff"/>
        <!-- blinking lid -->
        <ellipse cx="462" cy="98" rx="9.5" ry="0" fill="#f3f6fa">
          <animate attributeName="ry" values="0;0;9.5;0;0" keyTimes="0;0.92;0.955;0.99;1"
                   dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- wing (soft flap) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 352 188;-7 352 188;3 352 188;0 352 188" dur="1.6s" repeatCount="indefinite"/>
        <path d="M354,178 C320,166 274,178 250,200 C278,218 334,218 360,202 Z"
              fill="#e4eaf2" stroke="#bcc6d4" stroke-width="2"/>
        <g stroke="#c5cedb" stroke-width="2" fill="none">
          <path d="M282,196 C302,190 326,190 348,196"/>
          <path d="M276,204 C300,198 328,198 352,204"/>
        </g>
        <path d="M252,200 L232,192 L250,210 L236,214 L262,216 Z" fill="#c5cedb"/>
      </g>
    </g>

    <!-- NEAR CRANK + NEAR LEG (on top) -->
    <g transform="translate(408,375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="20" y2="0" stroke="#39424c" stroke-width="7" stroke-linecap="round"/>
        <rect x="8" y="-5" width="24" height="10" rx="3" fill="#20262c"/>
      </g>
    </g>
    <polyline fill="none" stroke="#f2a33c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
              points="356,242 420,293 428,375 442,381">
      <animate attributeName="points" dur=".8s" repeatCount="indefinite"
        values="356,242 420,293 428,375 442,381;
                356,242 395,314 408,395 422,401;
                356,242 416,298 388,375 402,381;
                356,242 431,276 408,355 422,361;
                356,242 420,293 428,375 442,381"/>
    </polyline>
  </g>
</svg>
