<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balls in a spinning hexagon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---- setup -------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy, R;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  R = Math.min(W, H) * 0.42; // hexagon circumradius
}
window.addEventListener('resize', resize);
resize();

// ---- parameters --------------------------------------------------------
const N_BALLS   = 10;
const BALL_R    = 14;      // ball radius (px)
const GRAVITY   = 1400;    // px/s^2
const RESTITUTION = 0.85;  // bounciness against walls
const WALL_FRICTION = 0.98; // tangential damping on wall hit
const OMEGA     = 0.7;     // hexagon angular velocity (rad/s)
const SUBSTEPS  = 4;       // physics substeps per frame (anti-tunneling)

let angle = 0; // current hexagon rotation

// ---- balls -------------------------------------------------------------
const balls = [];
for (let i = 0; i < N_BALLS; i++) {
  const a = Math.random() * Math.PI * 2;
  const d = Math.random() * R * 0.4;
  balls.push({
    x: cx + Math.cos(a) * d,
    y: cy - R * 0.2 + Math.sin(a) * d,
    vx: (Math.random() * 2 - 1) * 250,
    vy: (Math.random() * 2 - 1) * 100,
    color: `hsl(${i * 36}, 85%, 60%)`,
  });
}

// ---- geometry helpers --------------------------------------------------
function hexVertices(rot) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = rot + (i * Math.PI) / 3;
    pts.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) });
  }
  return pts;
}

// ---- physics -----------------------------------------------------------
function step(dt) {
  angle += OMEGA * dt;
  const v = hexVertices(angle);

  for (const b of balls) {
    b.vy += GRAVITY * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // collision against each hexagon edge
    for (let i = 0; i < 6; i++) {
      const A = v[i], B = v[(i + 1) % 6];
      // inward unit normal (regular hexagon: direction edge-midpoint -> center)
      let nx = cx - (A.x + B.x) / 2;
      let ny = cy - (A.y + B.y) / 2;
      const nl = Math.hypot(nx, ny);
      nx /= nl; ny /= nl;

      const dist = (b.x - A.x) * nx + (b.y - A.y) * ny; // signed distance to edge line
      if (dist < BALL_R) {
        // push the ball back inside
        b.x += nx * (BALL_R - dist);
        b.y += ny * (BALL_R - dist);

        // velocity of the moving wall at the contact point (v = omega x r)
        const rx = b.x - cx, ry = b.y - cy;
        const wvx = -OMEGA * ry, wvy = OMEGA * rx;

        // work in the wall's reference frame
        let rvx = b.vx - wvx, rvy = b.vy - wvy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          // reflect the normal component, damp the tangential one
          rvx -= (1 + RESTITUTION) * vn * nx;
          rvy -= (1 + RESTITUTION) * vn * ny;
          const n2 = rvx * nx + rvy * ny;
          let tx = rvx - n2 * nx, ty = rvy - n2 * ny;
          tx *= WALL_FRICTION; ty *= WALL_FRICTION;
          rvx = n2 * nx + tx;
          rvy = n2 * ny + ty;
        }
        b.vx = rvx + wvx;
        b.vy = rvy + wvy;
      }
    }

    // safety net: if a ball ever escapes, respawn it near the center
    if (Math.hypot(b.x - cx, b.y - cy) > R * 1.5) {
      b.x = cx; b.y = cy - R * 0.3;
      b.vx = (Math.random() * 2 - 1) * 200; b.vy = 0;
    }
  }

  // ball-ball collisions (equal mass)
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const min = BALL_R * 2;
      if (d > 0 && d < min) {
        const nx = dx / d, ny = dy / d;
        const overlap = (min - d) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const imp = -((1 + RESTITUTION) * vn) / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
        }
      }
    }
  }
}

// ---- rendering ---------------------------------------------------------
function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // hexagon
  const v = hexVertices(angle);
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.shadowColor = '#58a6ff';
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // balls
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    // small highlight
    ctx.beginPath();
    ctx.arc(b.x - BALL_R * 0.3, b.y - BALL_R * 0.3, BALL_R * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
  }
}

// ---- main loop ---------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = Math.min((now - last) / 1000, 0.05); // cap to avoid huge jumps
  last = now;
  const h = dt / SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++) step(h);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body>
</html>
