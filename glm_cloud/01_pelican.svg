<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican in a red helmet rides a bike with spinning wheels, pedaling legs, a bobbing body, and a fish wagging in its beak pouch.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2fb"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun with slowly rotating rays -->
  <g transform="translate(700,80)">
    <g stroke="#ffd93d" stroke-width="5" stroke-linecap="round">
      <line x1="-52" y1="0" x2="52" y2="0"/>
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="-37" y1="-37" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="-37" y2="37"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
    <circle r="30" fill="#ffd93d"/>
  </g>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.93">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 70; -180 70" dur="24s" repeatCount="indefinite"/>
      <ellipse rx="36" ry="17"/><ellipse cx="-30" cy="6" rx="24" ry="12"/><ellipse cx="30" cy="7" rx="26" ry="12"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="980 140; -160 140" dur="34s" begin="-15s" repeatCount="indefinite"/>
      <g transform="scale(0.72)">
        <ellipse rx="36" ry="17"/><ellipse cx="-30" cy="6" rx="24" ry="12"/><ellipse cx="30" cy="7" rx="26" ry="12"/>
      </g>
    </g>
  </g>

  <!-- Grass and scrolling bushes -->
  <rect y="436" width="800" height="16" fill="#7ec850"/>
  <g fill="#57a644">
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 448; -140 448" dur="6s" repeatCount="indefinite"/>
      <circle r="14"/><circle cx="15" cy="3" r="10"/><circle cx="-14" cy="4" r="9"/>
    </g>
    <g fill="#4c9440">
      <animateTransform attributeName="transform" type="translate" values="900 450; -120 450" dur="8.5s" begin="-4s" repeatCount="indefinite"/>
      <g transform="scale(0.75)">
        <circle r="14"/><circle cx="15" cy="3" r="10"/><circle cx="-14" cy="4" r="9"/>
      </g>
    </g>
  </g>

  <!-- Road with moving dashes -->
  <rect y="452" width="800" height="48" fill="#565b63"/>
  <line x1="0" y1="453" x2="800" y2="453" stroke="#3f444b" stroke-width="3"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#eef2f5" stroke-width="5" stroke-dasharray="27 27" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="54" dur="0.12s" repeatCount="indefinite"/>
  </line>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <g>
      <line x1="60" y1="300" x2="112" y2="300"/>
      <animateTransform attributeName="transform" type="translate" values="30 0; -230 0" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.7;1" dur="0.55s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="42" y1="346" x2="98" y2="346"/>
      <animateTransform attributeName="transform" type="translate" values="30 0; -230 0" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.7;1" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="66" y1="396" x2="126" y2="396"/>
      <animateTransform attributeName="transform" type="translate" values="30 0; -230 0" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.7;1" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bike shadow -->
  <ellipse cx="390" cy="457" rx="185" ry="9" fill="#000000" opacity="0.16"/>

  <!-- Rear wheel -->
  <g>
    <g stroke="#8a939e" stroke-width="2.5">
      <line x1="191" y1="380" x2="309" y2="380"/>
      <line x1="191" y1="380" x2="309" y2="380" transform="rotate(45 250 380)"/>
      <line x1="191" y1="380" x2="309" y2="380" transform="rotate(90 250 380)"/>
      <line x1="191" y1="380" x2="309" y2="380" transform="rotate(135 250 380)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 380" to="360 250 380" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle cx="250" cy="380" r="59" fill="none" stroke="#aeb6bf" stroke-width="3"/>
    <circle cx="250" cy="380" r="70" fill="none" stroke="#2f3640" stroke-width="9"/>
    <circle cx="250" cy="380" r="7" fill="#444a51"/>
  </g>

  <!-- Front wheel -->
  <g>
    <g stroke="#8a939e" stroke-width="2.5">
      <line x1="471" y1="380" x2="589" y2="380"/>
      <line x1="471" y1="380" x2="589" y2="380" transform="rotate(45 530 380)"/>
      <line x1="471" y1="380" x2="589" y2="380" transform="rotate(90 530 380)"/>
      <line x1="471" y1="380" x2="589" y2="380" transform="rotate(135 530 380)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 530 380" to="360 530 380" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle cx="530" cy="380" r="59" fill="none" stroke="#aeb6bf" stroke-width="3"/>
    <circle cx="530" cy="380" r="70" fill="none" stroke="#2f3640" stroke-width="9"/>
    <circle cx="530" cy="380" r="7" fill="#444a51"/>
  </g>

  <!-- Chain, cog and chainring -->
  <circle cx="250" cy="380" r="8" fill="none" stroke="#4a4f55" stroke-width="3"/>
  <line x1="250" y1="372" x2="370" y2="374" stroke="#4a4f55" stroke-width="3" stroke-dasharray="5 3">
    <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.16s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="388" x2="370" y2="406" stroke="#4a4f55" stroke-width="3" stroke-dasharray="5 3">
    <animate attributeName="stroke-dashoffset" from="0" to="8" dur="0.16s" repeatCount="indefinite"/>
  </line>
  <circle cx="370" cy="390" r="16" fill="none" stroke="#4a4f55" stroke-width="4"/>

  <!-- Frame -->
  <path d="M250,380 L370,390 L334,266 M250,380 L336,270 M370,390 L502,272 M336,272 L500,272 M530,380 L503,270"
        fill="none" stroke="#d64545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Seat -->
  <line x1="334" y1="266" x2="332" y2="250" stroke="#6a6f76" stroke-width="5"/>
  <rect x="310" y="246" width="42" height="10" rx="5" fill="#2f3640"/>

  <!-- Rotating crank arms -->
  <g stroke="#3a3f45" stroke-width="6" stroke-linecap="round">
    <line x1="370" y1="390" x2="408" y2="390"/>
    <line x1="370" y1="390" x2="332" y2="390"/>
    <animateTransform attributeName="transform" type="rotate" from="0 370 390" to="360 370 390" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Handlebars -->
  <path d="M503,270 L498,250 L470,244" fill="none" stroke="#444a51" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="470" cy="244" r="5" fill="#2f3640"/>

  <!-- Wing holding the handlebar -->
  <path d="M352,206 C400,220 436,234 462,244" fill="none" stroke="#c9d2da" stroke-width="19" stroke-linecap="round"/>
  <path d="M352,206 C400,220 436,234 462,244" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="466" cy="245" rx="7" ry="6" fill="#ffffff" stroke="#c9d2da" stroke-width="2"/>

  <!-- Far leg pedaling -->
  <path d="M340,252 Q361,322 332,390" fill="none" stroke="#d1802c" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M340,252 Q361,322 332,390; M340,252 Q366,307 343,363; M340,252 Q379,295 370,352; M340,252 Q391,296 397,363; M340,252 Q396,310 408,390; M340,252 Q392,326 397,417; M340,252 Q380,336 370,428; M340,252 Q366,334 343,417; M340,252 Q361,322 332,390"/>
  </path>
  <g>
    <rect x="-13" y="-4" width="26" height="8" rx="3.5" fill="#2f3640"/>
    <path d="M-12,-3 L16,-3 L3,-14 Z" fill="#d1802c" stroke="#a3651f" stroke-width="1.5" stroke-linejoin="round"/>
    <animateMotion dur="2s" repeatCount="indefinite" path="M332,390 A38,38 0 1 1 408,390 A38,38 0 1 1 332,390"/>
  </g>

  <!-- Near leg pedaling -->
  <path d="M340,252 Q396,310 408,390" fill="none" stroke="#f0962f" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M340,252 Q396,310 408,390; M340,252 Q392,326 397,417; M340,252 Q380,336 370,428; M340,252 Q366,334 343,417; M340,252 Q361,322 332,390; M340,252 Q366,307 343,363; M340,252 Q379,295 370,352; M340,252 Q391,296 397,363; M340,252 Q396,310 408,390"/>
  </path>
  <g>
    <rect x="-13" y="-4" width="26" height="8" rx="3.5" fill="#2f3640"/>
    <path d="M-12,-3 L16,-3 L3,-14 Z" fill="#f5a03a" stroke="#b96a1e" stroke-width="1.5" stroke-linejoin="round"/>
    <animateMotion dur="2s" repeatCount="indefinite" path="M408,390 A38,38 0 1 1 332,390 A38,38 0 1 1 408,390"/>
  </g>

  <!-- Pelican (gently bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" keyTimes="0;0.5;1" dur="1s"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- Tail -->
    <path d="M290,196 C264,186 248,170 242,148 C258,162 274,170 286,178 Z" fill="#ffffff" stroke="#9aa5b1" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Wing (subtle flutter) -->
    <g transform="rotate(14 322 212)">
      <ellipse cx="322" cy="212" rx="40" ry="25" fill="#eef2f6" stroke="#c3ccd6" stroke-width="2.5"/>
      <path d="M292,214 Q320,224 352,212 M290,204 Q318,214 350,202" fill="none" stroke="#c3ccd6" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 322 212; -4 322 212; 0 322 212"
        keyTimes="0;0.5;1" dur="1.3s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </g>

    <!-- Body -->
    <ellipse cx="330" cy="205" rx="62" ry="42" fill="#ffffff" stroke="#9aa5b1" stroke-width="2.5" transform="rotate(18 330 205)"/>

    <!-- Neck -->
    <path d="M362,196 C404,204 418,180 424,156 C430,132 436,122 452,118" fill="none" stroke="#9aa5b1" stroke-width="23" stroke-linecap="round"/>
    <path d="M362,196 C404,204 418,180 424,156 C430,132 436,122 452,118" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>

    <!-- Fish tail wagging out of the beak -->
    <g>
      <path d="M582,147 L602,120 L598,136 L612,132 L592,150 Z" fill="#8ec9dd" stroke="#5b93a8" stroke-width="1.5" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-12 583 146; 12 583 146; -12 583 146"
        keyTimes="0;0.5;1" dur="0.7s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </g>

    <!-- Throat pouch (jiggling) -->
    <path d="M464,128 Q524,205 583,148 Q522,132 464,128 Z" fill="#f9a65a" stroke="#d4821a" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"
        values="M464,128 Q524,205 583,148 Q522,132 464,128 Z; M464,128 Q524,218 583,148 Q522,132 464,128 Z; M464,128 Q524,205 583,148 Q522,132 464,128 Z"/>
    </path>

    <!-- Upper beak -->
    <path d="M463,110 Q532,124 585,143 L585,149 Q522,136 463,128 Z" fill="#f5a623" stroke="#d4821a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M477,116 L492,120" stroke="#b97716" stroke-width="2" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="455" cy="120" r="20" fill="#ffffff" stroke="#9aa5b1" stroke-width="2.5"/>

    <!-- Helmet -->
    <path d="M435,109 Q437,87 455,86 Q473,87 475,109 Z" fill="#e74c3c" stroke="#b03030" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M446,91 L444,107 M464,91 L466,107" stroke="#b03030" stroke-width="2"/>
    <circle cx="455" cy="86" r="3" fill="#b03030"/>

    <!-- Eye -->
    <circle cx="463" cy="115" r="4.3" fill="#26292e"/>
    <circle cx="464.6" cy="113.4" r="1.4" fill="#ffffff"/>
  </g>
</svg>
