<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Voxel Hanami — a pagoda garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#a6d5e8;font-family:'IBM Plex Sans',sans-serif}
  #stage{position:fixed;inset:0;opacity:0;animation:fade 1.4s .1s forwards}
  #stage canvas{display:block;cursor:grab}
  #stage canvas.grabbing{cursor:grabbing}
  @keyframes fade{to{opacity:1}}
  #brand{position:fixed;top:30px;left:38px;color:#1e3038;pointer-events:none;user-select:none;transition:color .9s;z-index:5}
  #brand .rule{width:52px;height:2px;background:currentColor;opacity:.55;margin-bottom:14px}
  #brand h1{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(26px,3.2vw,38px);letter-spacing:.1em;text-transform:uppercase;line-height:1}
  #brand .sub{margin-top:9px;font-size:12.5px;font-weight:300;letter-spacing:.3em;opacity:.8}
  body.dusk #brand{color:#efe6d4}
  #hints{position:fixed;left:24px;bottom:20px;color:#25333b;font-size:12px;font-weight:400;letter-spacing:.05em;line-height:1.9;pointer-events:none;user-select:none;transition:color .9s;z-index:5}
  #hints b{font-weight:500}
  body.dusk #hints{color:#d9d2c2}
  #controls{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:6}
  .chip{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;border:1px solid rgba(25,40,50,.16);background:rgba(250,250,246,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:#22323c;font:500 12px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;cursor:pointer;transition:all .25s;user-select:none}
  .chip:hover{background:rgba(255,255,252,.9);transform:translateY(-1px)}
  .chip.off{opacity:.5}
  .chip svg{width:15px;height:15px;flex:none}
  #toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,10px);background:rgba(22,29,35,.85);color:#f3eee4;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:300;letter-spacing:.05em;opacity:0;transition:all .4s;pointer-events:none;z-index:10;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:640px){#hints{display:none}#brand{top:18px;left:20px}}
</style>
</head>
<body>
<div id="stage"></div>

<header id="brand">
  <div class="rule"></div>
  <h1>Voxel Hanami</h1>
  <div class="sub">五重塔の庭 &middot; a pagoda garden in bloom</div>
</header>

<div id="hints">
  <div><b>drag</b> orbit &nbsp;&middot;&nbsp; <b>scroll</b> zoom &nbsp;&middot;&nbsp; <b>right-drag</b> pan</div>
  <div>click the pond to feed the koi &nbsp;&middot;&nbsp; click the blossoms for a flurry</div>
</div>

<div id="controls">
  <button class="chip" id="btnPhase">
    <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
    <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
    <span id="phaseLabel">Evening</span>
  </button>
  <button class="chip" id="btnPetals">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="6.2" rx="2" ry="3.4"/><ellipse cx="12" cy="17.8" rx="2" ry="3.4"/><ellipse cx="6.2" cy="12" rx="3.4" ry="2"/><ellipse cx="17.8" cy="12" rx="3.4" ry="2"/></svg>
    <span>Petals</span>
  </button>
  <button class="chip" id="btnOrbit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.9-6.6"/><path d="M21 3v5h-5"/></svg>
    <span>Auto-orbit</span>
  </button>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   VOXEL HANAMI — a hand-authored voxel diorama
   Everything below builds the world into sparse voxel maps, then
   uploads them as a few InstancedMesh draw calls.
===================================================================== */

/* ---------- seeded RNG (deterministic art direction) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20240404);
function rr(a,b){return a+R()*(b-a)}
function ri(a,b){return Math.floor(a+R()*(b-a+1))}
function pick(arr){return arr[Math.floor(R()*arr.length)]}

/* ---------- palette ---------- */
const C={
  grass:[0x6fae4f,0x7ab857,0x82c05f,0x66a548,0x8cc668],
  dirt:[0x8a6242,0x7c5638,0x96694a],
  stone:[0x8f9096,0x84858c,0x999aa0], stoneD:[0x6f7077,0x63646b,0x77787f],
  sand:[0xd8c797,0xcdba8b],
  path:[0xbdb8a9,0xcdc8b9,0xa8a395,0x918d80],
  plinth:0xbdb7a8, plinthHi:0xd0cab9,
  wall:0xf2e5c9, pillar:0xb23a2c, gold:0xd9a441, goldHi:0xe8bb5a,
  tileA:0x3e4859, tileB:0x37404f, tileUnd:0x2c3341, ridge:0x2a3140,
  eaveDark:0x8a3b2c, eaveTrim:0xd9a441, wood:0x4a3226, glowWin:0xffc978, bell:0xf3c46a,
  torii:0xd5452f, toriiCap:0x3a3a41,
  bridge:0xb8442f, bridgeD:0x9e3a27,
  waterA:[0x49b2e6,0x54bcec,0x40a8dc], waterLow:0x2e86bb, waterLow2:0x2a7cae,
  sandFloor:0xcdbb8c, sandFloorDeep:0xb5a273,
  trunk:[0x6b4632,0x5d3b29,0x77503a],
  blossomWhite:0xffe6ef, blossomMid:0xffa8cb, blossomLight:0xffc3dd, blossomDeep:0xf284ae,
  rock:[0x9a9aa2,0x8a8a92,0x7c7c84], moss:0x6fae4e,
  tuft:[0x5f9c46,0x6fae4f,0x79b552],
  flower:[0xe8484f,0xf5b83d,0xf7f3ea,0xa86ee0,0xf07f3c,0xff8fb8],
  petal:[0xf573a8,0xef6ba4,0xff8fb8,0xe8639a],
  mapleLeaf:[0xe2703a,0xf08c3e],
  cloud:[0xffffff,0xf2f7fb,0xe4edf4], cloudUnd:0xc9d8e2,
  pine:[0x3e7a4a,0x356b41,0x478a54],
  bamboo:[0x7fb944,0x8ac24e,0x74ad3d], bambooRing:0xa9d66b, bambooLeaf:0x9ccf5c,
  jewel:0xff6a52, lanternL:0xffd98f, koiFood:0xe0c274
};

/* ---------- renderer / scene ---------- */
const container=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa6d5e8);
scene.fog=new THREE.Fog(0xa6d5e8,170,430);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.5,1200);

const hemi=new THREE.HemisphereLight(0xd4ecf7,0x93a866,0.55); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,0.12); scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff2d8,0.95);
sun.position.set(78,98,52); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;
sc.left=-95;sc.right=95;sc.top=95;sc.bottom=-95;sc.near=20;sc.far=340;
sc.updateProjectionMatrix();
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.35;
scene.add(sun); scene.add(sun.target); sun.target.position.set(0,10,0);

const pls=[[22,4,-1],[-8,5,24],[-6,6,1]].map(p=>{
  const l=new THREE.PointLight(0xffb46a,0,22,2); l.position.set(p[0],p[1],p[2]); scene.add(l); return l;
});

/* ---------- day / dusk palettes ---------- */
const cCol=h=>new THREE.Color(h);
const C_D={sky:cCol(0xa6d5e8),sun:cCol(0xfff2d8),sunP:new THREE.Vector3(78,98,52),
  hemiS:cCol(0xd4ecf7),hemiG:cCol(0x93a866),glow:cCol(0xffca7a),cloud:cCol(0xffffff),water:cCol(0xffffff)};
const C_K={sky:cCol(0x343158),sun:cCol(0xff9e63),sunP:new THREE.Vector3(-95,32,-18),
  hemiS:cCol(0x5a5e93),hemiG:cCol(0x33364d),glow:cCol(0xffe2a8),cloud:cCol(0x9388b8),water:cCol(0x9aa0cf)};
let envMix=0, envTarget=0;
const glowBase=C_D.glow.clone();

/* ---------- voxel storage ---------- */
class VoxelMap{
  constructor(){this.m=new Map()}
  key(x,y,z){return x+','+y+','+z}
  set(x,y,z,hex){this.m.set(this.key(x,y,z),hex)}
  has(x,y,z){return this.m.has(this.key(x,y,z))}
  del(x,y,z){this.m.delete(this.key(x,y,z))}
}
const SOLID=new VoxelMap(), WATER=new VoxelMap(), GLOW=new VoxelMap();

const _jc=new THREE.Color();
function jHex(hex,j){
  if(!j)return hex;
  _jc.setHex(hex);
  const f=1+(R()*2-1)*j;
  _jc.r=Math.min(1,_jc.r*f); _jc.g=Math.min(1,_jc.g*f); _jc.b=Math.min(1,_jc.b*f);
  return _jc.getHex();
}
function setC(map,x,y,z,hex){
  const k=x+','+y+','+z;
  if(map!==SOLID)SOLID.del(x,y,z);
  if(map!==GLOW)GLOW.del(x,y,z);
  if(map!==WATER)WATER.del(x,y,z);
  map.set(x,y,z,hex);
}
function V(x,y,z,hex,j){setC(SOLID,x,y,z,jHex(hex,j===undefined?0.05:j))}
function boxF(map,x0,y0,z0,x1,y1,z1,hex,j){
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)setC(map,x,y,z,jHex(hex,j===undefined?0.05:j));
}
function ringRect(cx,cz,y,h,hex,j){
  for(let u=-h;u<=h;u++){
    setC(SOLID,cx+u,y,cz+h,jHex(hex,j)); setC(SOLID,cx+u,y,cz-h,jHex(hex,j));
    setC(SOLID,cx+h,y,cz+u,jHex(hex,j)); setC(SOLID,cx-h,y,cz+u,jHex(hex,j));
  }
}
function lineVox(x0,y0,z0,x1,y1,z1,hex,j){
  const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0),1);
  for(let i=0;i<=n;i++){
    const t=i/n;
    V(Math.round(x0+(x1-x0)*t),Math.round(y0+(y1-y0)*t),Math.round(z0+(z1-z0)*t),hex,j);
  }
}
function blobF(map,cx,cy,cz,rx,ry,rz,cols,j,rough){
  for(let dx=-Math.ceil(rx);dx<=Math.ceil(rx);dx++)
  for(let dy=-Math.ceil(ry);dy<=Math.ceil(ry);dy++)
  for(let dz=-Math.ceil(rz);dz<=Math.ceil(rz);dz++){
    const d=dx*dx/(rx*rx)+dy*dy/(ry*ry)+dz*dz/(rz*rz);
    if(d>1-rough/2+R()*rough)continue;
    setC(map,cx+dx,cy+dy,cz+dz,jHex(pick(cols),j));
  }
}

/* free-form decorations (arbitrary position & scale, no grid keys) */
const DEC=[];
function deco(px,py,pz,hex,sx,sy,sz){DEC.push({x:px,y:py,z:pz,hex,sx:sx,sy:(sy===undefined?sx:sy),sz:(sz===undefined?sx:sz)})}

/* ---------- terrain ---------- */
const IX=48, IZ=34;
const heightMap=new Map(), groundType=new Map();
function insideIsland(x,z){
  const nx=Math.abs(x)/IX, nz=Math.abs(z)/IZ;
  if(nx>1||nz>1)return false;
  const d=Math.pow(nx,3.4)+Math.pow(nz,3.4);
  const a=Math.atan2(z,x);
  const w=0.05*Math.sin(a*3+1.3)+0.03*Math.sin(a*5+4.2);
  return d<=1+w;
}
function edgeT(x,z){return Math.min(1,Math.pow(Math.abs(x)/IX,3.4)+Math.pow(Math.abs(z)/IZ,3.4))}
function ellV(x,z,cx,cz,rx,rz){
  const a=Math.atan2(z-cz,x-cx);
  const w=1+0.06*Math.sin(a*3+cx)+0.04*Math.sin(a*5-cz);
  const dx=(x-cx)/(rx*w), dz=(z-cz)/(rz*w);
  return dx*dx+dz*dz;
}
function inPond(x,z){return Math.min(ellV(x,z,25,2,12,9),ellV(x,z,10,12,5.2,5.2))<=1}
function inIsle(x,z){return ellV(x,z,22,-1,3.6,3.4)<=1}
function hOf(x,z){const v=heightMap.get(x+','+z);return v===undefined?0:v}

function buildGround(){
  for(let x=-49;x<=49;x++)for(let z=-35;z<=35;z++){
    if(!insideIsland(x,z))continue;
    let h=0;
    if(z<-20)h=Math.min(3,Math.round((-20-z)*0.28));
    if(Math.abs(x)<=20&&Math.abs(z)<=14)h=0;
    const water=inPond(x,z)&&!inIsle(x,z);
    if(water)h=0;
    const k=x+','+z;
    heightMap.set(k,h);
    groundType.set(k,water?'water':'grass');
    V(x,h,z,pick(C.grass),0.05);
    for(let y=h-1;y>=h-3;y--)V(x,y,z,pick(C.dirt),0.06);
    const e=edgeT(x,z);
    const depth=3+Math.round(15*Math.pow(1-e,1.55))+ri(0,1);
    const bot=h-3-depth;
    for(let y=h-4;y>=bot;y--){
      if(y===bot&&R()<0.3)continue;
      if(y===bot+1&&R()<0.12)continue;
      V(x,y,z,y>bot+2?pick(C.stone):pick(C.stoneD),0.05);
    }
  }
  // rocky stalactites under the island
  blobF(SOLID,-8,-26,6,5,3,4,C.stoneD,0.05,0.4);
  blobF(SOLID,14,-24,-4,4,2.5,3,C.stoneD,0.05,0.4);
  blobF(SOLID,28,-22,14,3,2,2.5,C.stoneD,0.05,0.4);
}

/* ---------- pond ---------- */
const pondTiles=[], pondSet=new Set(), sandCells=[];
function carvePond(){
  for(let x=-49;x<=49;x++)for(let z=-35;z<=35;z++){
    if(groundType.get(x+','+z)!=='water')continue;
    const dmin=Math.min(ellV(x,z,25,2,12,9),ellV(x,z,10,12,5.2,5.2));
    const deep=dmin<0.45;
    SOLID.del(x,0,z);SOLID.del(x,-1,z);SOLID.del(x,-2,z);
    const floorY=deep?-3:-2;
    setC(SOLID,x,floorY,z,jHex(deep?C.sandFloorDeep:C.sandFloor,0.05));
    for(let y=-1;y>=floorY+1;y--)setC(SOLID,x,y,z,jHex(pick([C.waterLow,C.waterLow2]),0.04));
    pondTiles.push({x,z,deep});
    pondSet.add(x+','+z);
  }
  for(const t of pondTiles){
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
      const kx=t.x+dx,kz=t.z+dz,k=kx+','+kz;
      if(groundType.get(k)==='grass'){
        V(kx,hOf(kx,kz),kz,C.sand[0],0.05);
        groundType.set(k,'sand');
        if(dx===0||dz===0)sandCells.push({x:kx,z:kz});
      }
    }
  }
}

/* ---------- paths ---------- */
function pset(x,z){
  if(!insideIsland(x,z))return;
  const k=x+','+z;
  if(groundType.get(k)==='water')return;
  V(x,hOf(x,z),z,pick(C.path),0.06);
  groundType.set(k,'path');
}
function stampPath(x0,z0,x1,z1,w){
  if(x0===x1){for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++)for(let i=0;i<w;i++)pset(x0+i,z);}
  else{for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)for(let i=0;i<w;i++)pset(x,z0+i);}
}
function buildPaths(){
  stampPath(-5,29,-5,4,2);
  stampPath(-4,18,9,18,2);
  stampPath(10,5,-4,5,2);
  // stepping stones out to the lantern island
  const stones=[[13.5,3.5],[16,1.5]];
  for(const s of stones){
    deco(s[0],-0.35,s[1],0xb3aea0,1.1,0.7,1.1);
    deco(s[0]+0.8,-0.42,s[1]+0.5,0xa29d90,0.7,0.55,0.7);
  }
}

/* ---------- pagoda ---------- */
const PX=-6, PZ=-6;
function putWindow(face,b,wy,wh,ww,door){
  const map={S:{ax:'x',w:PZ+b},N:{ax:'x',w:PZ-b},E:{ax:'z',w:PX+b},W:{ax:'z',w:PX-b}}[face];
  const cen=map.ax==='x'?PX:PZ;
  const c0=cen-Math.floor(ww/2), c1=c0+ww-1;
  for(let u=c0-1;u<=c1+1;u++)for(let yy=wy-1;yy<=wy+wh;yy++){
    if(!(u<c0||u>c1||yy<wy||yy>wy+wh-1))continue;
    const x=map.ax==='x'?u:map.w, z=map.ax==='x'?map.w:u;
    V(x,yy,z,C.wood,0.05);
  }
  for(let u=c0;u<=c1;u++)for(let yy=wy;yy<wy+wh;yy++){
    const x=map.ax==='x'?u:map.w, z=map.ax==='x'?map.w:u;
    const lit=!door||(u===cen&&yy>wy&&yy<wy+wh-1);
    if(lit)setC(GLOW,x,yy,z,C.glowWin); else V(x,yy,z,C.wood,0.05);
  }
}
function buildBody(i,yb,b,h){
  const yT=yb+h;
  boxF(SOLID,PX-b,yb,PZ-b,PX+b,yT,PZ+b,C.wall,0.045);
  for(const sx of[-1,1])for(const sz of[-1,1]){
    for(let y=yb;y<=yT;y++)V(PX+sx*b,y,PZ+sz*b,C.pillar,0.04);
    V(PX+sx*b,yb+1,PZ+sz*b,C.gold,0.03);
  }
  ringRect(PX,PZ,yb,b,C.pillar,0.04);
  ringRect(PX,PZ,yb+1,b,C.pillar,0.04);
  ringRect(PX,PZ,yT,b,C.pillar,0.04);
  if(i===0){
    putWindow('S',b,yb+1,4,3,true);
    putWindow('E',b,yb+3,2,2); putWindow('W',b,yb+3,2,2); putWindow('N',b,yb+3,2,2);
  }else if(i===4){
    for(const f of['S','E','W','N'])putWindow(f,b,yb+2,1,1);
  }else if(i===3){
    for(const f of['S','E','W','N'])putWindow(f,b,yb+2,2,2);
  }else{
    for(const f of['S','E','W','N'])putWindow(f,b,yb+3,2,2);
  }
}
function buildRoof(y0,r,rh){
  const inner=2,N=r-inner+1;
  for(let t=0;t<N;t++){
    const k=r-t;
    const yT=y0+Math.floor(rh*Math.pow(t/Math.max(1,N-1),1.45));
    let hex;
    if(t===0)hex=C.eaveTrim; else if(t===1)hex=C.eaveDark;
    else if(t===N-1)hex=C.ridge; else hex=(t%2)?C.tileA:C.tileB;
    ringRect(PX,PZ,yT,k,hex,0.045);
    if(yT>y0)ringRect(PX,PZ,yT-1,k,C.tileUnd,0.05);
    if(t===0){
      for(const sx of[-1,1])for(const sz of[-1,1]){
        V(PX+sx*k,yT,PZ+sz*k,C.eaveDark,0.03);
        V(PX+sx*k,yT+1,PZ+sz*k,C.eaveDark,0.03);
        V(PX+sx*k,yT+2,PZ+sz*k,C.gold,0.03);
        V(PX+sx*(k-1),yT+1,PZ+sz*k,C.eaveDark,0.04);
        V(PX+sx*k,yT+1,PZ+sz*(k-1),C.eaveDark,0.04);
      }
      setC(GLOW,PX+k,yT-1,PZ,C.bell); setC(GLOW,PX-k,yT-1,PZ,C.bell);

/* ---------- arched bridge ---------- */
function buildBridge(){
  const x0=9,x1=11,zA=5,zB=19;
  const arcY=z=>1+Math.round(3.4*Math.sin(Math.PI*(z-zA)/(zB-zA)));
  for(let z=zA;z<=zB;z++){
    const y=arcY(z);
    for(let x=x0;x<=x1;x++){
      const hex=(x===x0||x===x1)?C.bridgeD:((z%2===0)?C.bridge:0xc14f36);
      V(x,y,z,hex,0.05);
    }
  }
  for(const x of[x0,x1]){
    for(let z=zA;z<=zB;z++){
      const y=arcY(z);
      if((z-zA)%3===0||z===zB){V(x,y+1,z,C.bridgeD,0.05);V(x,y+2,z,C.bridge,0.05);}
      else V(x,y+2,z,C.bridge,0.05);
    }
  }
  for(const z of[zA,zB])for(const x of[x0,x1])V(x,arcY(z)+3,z,C.gold,0.03);
  for(const z of[7,12,17]){
    for(let x=x0;x<=x1;x++)for(let y=-4;y<=arcY(z)-1;y++)V(x,y,z,pick(C.stoneD),0.05);
  }
}

const canopies=[], canopyTargets=[];
function canopyBlob(cx,cy,cz,r,pal,deep){
  for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
    const d=dx*dx+dy*dy*1.25+dz*dz;
    if(d>(r*r)*(0.82+R()*0.3))continue;
    let hex;
    const t=(dy/r+1)/2, p=R();
    if(p<0.06)hex=pal.white;
    else if(t<0.4)hex=deep;
    else if(t<0.72)hex=pal.mid;
    else hex=pal.light;
    V(cx+dx,cy+dy,cz+dz,hex,0.035);
  }
  canopies.push({x:cx,y:cy,z:cz,r:r+1});
}
function petalCarpet(cx,cz,rad,cols){
  const R2=rad*rad;
  for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
    if(dx*dx+dz*dz>R2)continue;
    const x=Math.round(cx+dx),z=Math.round(cz+dz);
    if(groundType.get(x+','+z)!=='grass')continue;
    if(R()>0.4)continue;
    deco(x+0.5,hOf(x,z)+1.13,z+0.5,pick(cols),0.72,0.16,0.72);
  }
}
function leafTree(x,z,o){
  o=o||{};
  const g=hOf(x,z),base=g+1;
  const H=o.h||ri(7,11);
  const lx=o.leanX||0, lz=o.leanZ||0;
  let tx=x,tz=z;
  for(let i=0;i<H;i++){
    tx=x+Math.round(lx*(i/H)*3); tz=z+Math.round(lz*(i/H)*3);
    const y=base+i;
    if(i<3)boxF(SOLID,tx,y,tz,tx+1,y,tz+1,pick(C.trunk),0.05);
    else V(tx,y,tz,pick(C.trunk),0.05);
  }
  const topY=base+H-1;
  const nb=o.blobs||ri(4,6);
  for(let b=0;b<nb;b++){
    const a=(b/nb)*Math.PI*2+rr(-0.4,0.4);
    const rad=rr(1.5,2.5+H*0.15);
    const bx=Math.round(tx+Math.cos(a)*rad)+(o.bx||0);
    const bz=Math.round(tz+Math.sin(a)*rad)+(o.bz||0);
    const by=topY+(o.droop?ri(-2,1):ri(0,2));
    lineVox(tx,topY,tz,bx,by,bz,pick(C.trunk),0.05);
    canopyBlob(bx,by,bz,Math.round(rr(2.2,o.maxR||3.6)),o.pal,o.deep);
  }
  lineVox(tx,topY,tz,tx,topY+2,tz,pick(C.trunk),0.05);
  canopyBlob(tx,topY+2,tz,Math.round((o.maxR||3.6)*0.85),o.pal,o.deep);

function initKoiSpot(k){
  for(let a=0;a<12;a++){
    const wx=25+ri(-5,5),wz=1+ri(-3,3),wr=rr(2.5,5.5);
    let ok=true;
    for(let i=0;i<8;i++){

      if(!pondSet.has(Math.floor(wx+Math.cos(an)*wr)+','+Math.floor(wz+Math.sin(an)*wr))){ok=false;break}
    }

koiDefs.forEach((d,i)=>{

    spin:(R()<0.5?-1:1)*rr(0.5,0.9),ca:R()*6.283,ph:R()*6.283,gulp:0,wx:25,wz:1,wr:4};
  initKoiSpot(k);

function updateKoi(k,dt){
  let tgt=null,best=16;
  for(const f of foods){
    if(!f.active)continue;
    const dd=k.p.distanceTo(f.mesh.position);
    if(dd<best){best=dd;tgt=f}
  }
  let dvx,dvz;
  if(tgt){dvx=tgt.mesh.position.x-k.p.x;dvz=tgt.mesh.position.z-k.p.z}
  else{
    k.ca+=k.spin*dt;
    dvx=(k.wx+Math.cos(k.ca)*k.wr)-k.p.x;
    dvz=(k.wz+Math.sin(k.ca)*k.wr)-k.p.z;
  }
  let l=Math.hypot(dvx,dvz)||1;dvx/=l;dvz/=l;
  if(!pondSet.has(Math.floor(k.p.x+dvx*1.6)+','+Math.floor(k.p.z+dvz*1.6))){
    dvx=25.5-k.p.x;dvz=1.5-k.p.z;
    l=Math.hypot(dvx,dvz)||1;dvx/=l;dvz/=l;
  }
  const cur=Math.atan2(k.hx,k.hz),want=Math.atan2(dvx,dvz);
  let diff=want-cur;
  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;
  const turn=Math.max(-2.6*dt,Math.min(2.6*dt,diff));
  const na=cur+turn;
  k.hx=Math.sin(na);k.hz=Math.cos(na);
  const sp=tgt?3.4:k.sp;
  k.p.x+=k.hx*sp*dt;k.p.z+=k.hz*sp*dt;
  if(tgt&&best<0.9){tgt.active=false;ripple(tgt.mesh.position.x,tgt.mesh.position.z,1);k.gulp=1}
  k.gulp=Math.max(0,k.gulp-dt*2);
  k.g.position.set(k.p.x,0.8+Math.sin(T*2+k.ph)*0.05,k.p.z);
  k.g.rotation.y=na;
  const gs=1+k.gulp*0.15;
  k.g.scale.set(gs,gs,gs);
  k.g.userData.tail.rotation.y=Math.sin(T*7+k.ph)*0.5;
}

function pan(dx,dy){

  ctrl.tgt.x+=(-dx*rx+dy*fx)*k;
  ctrl.tgt.z+=(-dx*rz+dy*fz)*k;

const el=renderer.domElement;
const ptrs=new Map();
let dragBtn=-1,moved=0,pinchD=0;
el.addEventListener('pointerdown',e=>{
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragBtn=e.button;moved=0;lastInput=T;
  el.classList.add('grabbing');
  if(ptrs.size===2){const a=[...ptrs.values()];pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
});
el.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  lastInput=T;
  if(ptrs.size===2){
    const a=[...ptrs.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){ctrl.tDist*=pinchD/d;clampDist()}
    pinchD=d;moved+=10;
    return;
  }
  moved+=Math.abs(dx)+Math.abs(dy);
  if(dragBtn===2||dragBtn===1)pan(dx,dy);
  else{
    ctrl.theta-=dx*0.0052;
    ctrl.phi-=dy*0.0042;
    ctrl.vT=-dx*0.0052;ctrl.vP=-dy*0.0042;
    clampAng();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchD=0;
  if(ptrs.size===0){
    el.classList.remove('grabbing');

}

  }
});
if(!cloudMat)cloudMat=new THREE.MeshLambertMaterial({color:0xffffff});
if(!waterMat)waterMat=new THREE.MeshPhongMaterial({color:0xffffff});

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
let gustT=8,ripT=3;
applyEnv(0);
applyCam();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta());
  T+=dt;

  // env blend
  if(Math.abs(envTarget-envMix)>0.001){
    envMix+=(envTarget-envMix)*Math.min(1,dt*1.4);
    if(Math.abs(envTarget-envMix)<0.002)envMix=envTarget;
    applyEnv(envMix);
  }

  // camera
  if(ptrs.size===0){
    ctrl.theta+=ctrl.vT;ctrl.phi+=ctrl.vP;
    ctrl.vT*=0.9;ctrl.vP*=0.9;
    clampAng();
    if(autoOrbit&&T-lastInput>4)ctrl.theta+=dt*0.05;
  }
  ctrl.dist+=(ctrl.tDist-ctrl.dist)*Math.min(1,dt*6);
  applyCam();

  // water shimmer
  for(const t of waterTops){
    const s=0.42+0.14*Math.sin(T*1.7+t.ph)+0.06*Math.sin(T*2.6+t.ph*1.7);
    DD.position.set(t.x+0.5,0.5,t.z+0.5);
    DD.rotation.set(0,0,0);DD.scale.set(1,s,1);DD.updateMatrix();
    waterMesh.setMatrixAt(t.i,DD.matrix);
  }
  waterMesh.instanceMatrix.needsUpdate=true;

  // ambient ripples
  ripT-=dt;
  if(ripT<0){
    ripT=rr(2.5,5);
    const t=pondTiles[Math.floor(Math.random()*pondTiles.length)];
    if(t)ripple(t.x+0.5,t.z+0.5,0.55);
  }
  updateRipples(dt);

  // koi & food
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];f.age+=dt;
    if(f.active){
      f.mesh.position.y=SURF+0.12+Math.sin(T*3+f.age)*0.04;
      if(f.age>18)f.active=false;
    }else{
      f.mesh.scale.multiplyScalar(Math.max(0,1-dt*4));
      f.mesh.position.y-=dt*0.5;
      if(f.mesh.scale.x<0.02){scene.remove(f.mesh);foods.splice(i,1)}
    }
  }
  for(const k of kois)updateKoi(k,dt);

  // petals
  if(petalsOn){
    gustT-=dt;
    if(gustT<0){
      gustT=rr(12,22);
      petalBurst(canopies[ri(0,canopies.length-1)],14);
    }
    updatePetals(dt);
  }

  updateFireflies();
  updateBirds(dt);

  // clouds
  for(const c of clouds){
    c.mesh.position.x+=c.spd*dt;
    if(c.mesh.position.x>150)c.mesh.position.x=-150;
    c.mesh.position.y=c.y+Math.sin(T*0.13+c.ph)*1.6;
  }
  for(const b of bobbers)b.mesh.position.y=b.y+Math.sin(T*0.3+b.ph)*1.2;

  // lantern / window flicker
  waterMesh.material.color; // (kept in sync by applyEnv)
  scene.traverse; // no-op
  glowMatProxy();
  renderer.render(scene,camera);
}
const _glowMat=(()=>{let m=null;scene.traverse(o=>{if(o.isInstancedMesh&&o.material.isMeshBasicMaterial&&!o.material.transparent){m=o.material}});return m})();
function glowMatProxy(){
  if(!_glowMat)return;
  _glowMat.color.copy(glowBase).multiplyScalar(1+0.05*Math.sin(T*6.3)+0.03*Math.sin(T*9.7));
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
