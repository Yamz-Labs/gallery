<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="Animated cartoon pelican riding a bicycle along a country road">
  <title>Pelican riding a bicycle</title>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4fb3ef"/>
      <stop offset="55%"  stop-color="#a9dcf7"/>
      <stop offset="100%" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#565b62"/>
      <stop offset="100%" stop-color="#31353a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#f3f7fa"/>
      <stop offset="100%" stop-color="#dde6ee"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY / SUN / CLOUDS ================= -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

  <circle cx="715" cy="75" r="62" fill="#ffe89a" opacity="0.55"/>
  <circle cx="715" cy="75" r="44" fill="#ffd23f"/>

  <g fill="#ffffff" opacity="0.92">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -800 0" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(90,95)">
      <ellipse cx="0"  cy="0"  rx="46" ry="24"/>
      <ellipse cx="42" cy="8"  rx="34" ry="18"/>
      <ellipse cx="-38" cy="9" rx="30" ry="16"/>
    </g>
    <g transform="translate(455,150)">
      <ellipse cx="0"  cy="0"  rx="38" ry="20"/>
      <ellipse cx="36" cy="7"  rx="28" ry="15"/>
      <ellipse cx="-32" cy="8" rx="24" ry="13"/>
    </g>
    <g transform="translate(890,95)">
      <ellipse cx="0"  cy="0"  rx="46" ry="24"/>
      <ellipse cx="42" cy="8"  rx="34" ry="18"/>
      <ellipse cx="-38" cy="9" rx="30" ry="16"/>
    </g>
    <g transform="translate(1255,150)">
      <ellipse cx="0"  cy="0"  rx="38" ry="20"/>
      <ellipse cx="36" cy="7"  rx="28" ry="15"/>
      <ellipse cx="-32" cy="8" rx="24" ry="13"/>
    </g>
  </g>

  <!-- ================= LANDSCAPE ================= -->
  <ellipse cx="150" cy="512" rx="270" ry="70" fill="#8fd07a"/>
  <ellipse cx="620" cy="516" rx="300" ry="62" fill="#7cc46b"/>
  <rect x="0" y="498" width="800" height="20" fill="#79c465"/>
  <rect x="0" y="515" width="800" height="85" fill="url(#roadGrad)"/>

  <!-- rushing lane markings -->
  <g fill="#f2f4f6" opacity="0.85">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -200 0" dur="0.35s" repeatCount="indefinite"/>
    <rect x="-400" y="556" width="90" height="9" rx="4"/>
    <rect x="-200" y="556" width="90" height="9" rx="4"/>
    <rect x="0"    y="556" width="90" height="9" rx="4"/>
    <rect x="200"  y="556" width="90" height="9" rx="4"/>
    <rect x="400"  y="556" width="90" height="9" rx="4"/>
    <rect x="600"  y="556" width="90" height="9" rx="4"/>
    <rect x="800"  y="556" width="90" height="9" rx="4"/>
    <rect x="1000" y="556" width="90" height="9" rx="4"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="translate"
                      values="80 0; -170 0" dur="0.7s" repeatCount="indefinite"/>
    <line x1="60"  y1="250" x2="150" y2="250"/>
    <line x1="10"  y1="315" x2="120" y2="315"/>
    <line x1="70"  y1="385" x2="170" y2="385"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="517" rx="185" ry="11" fill="#000" opacity="0.20"/>

  <!-- ================= WHEELS ================= -->
  <!-- rear wheel -->
  <g>
    <circle cx="280" cy="440" r="75" fill="none" stroke="#26292d" stroke-width="9"/>
    <circle cx="280" cy="440" r="66" fill="none" stroke="#cbd3da" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 280 440" to="360 280 440" dur="0.7s" repeatCount="indefinite"/>
      <g stroke="#9aa8b5" stroke-width="3" stroke-linecap="round">
        <line x1="280" y1="377" x2="280" y2="503"/>
        <line x1="280" y1="377" x2="280" y2="503" transform="rotate(45 280 440)"/>
        <line x1="280" y1="377" x2="280" y2="503" transform="rotate(90 280 440)"/>
        <line x1="280" y1="377" x2="280" y2="503" transform="rotate(135 280 440)"/>
      </g>
      <circle cx="280" cy="440" r="10" fill="#5b6470"/>
    </g>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="520" cy="440" r="75" fill="none" stroke="#26292d" stroke-width="9"/>
    <circle cx="520" cy="440" r="66" fill="none" stroke="#cbd3da" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 520 440" to="360 520 440" dur="0.7s" repeatCount="indefinite"/>
      <g stroke="#9aa8b5" stroke-width="3" stroke-linecap="round">
        <line x1="520" y1="377" x2="520" y2="503"/>
        <line x1="520" y1="377" x2="520" y2="503" transform="rotate(45 520 440)"/>
        <line x1="520" y1="377" x2="520" y2="503" transform="rotate(90 520 440)"/>
        <line x1="520" y1="377" x2="520" y2="503" transform="rotate(135 520 440)"/>
      </g>
      <circle cx="520" cy="440" r="10" fill="#5b6470"/>
    </g>
  </g>

  <!-- ================= FAR LEG (behind frame) ================= -->
  <g>
    <polyline points="330,322 365,400 380,475" fill="none" stroke="#d9860f"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="points" dur="1.4s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="330,322 365,400 380,475;
                330,322 350,400 355,465;
                330,322 345,395 345,440;
                330,322 358,385 355,415;
                330,322 378,372 380,405;
                330,322 385,375 405,415;
                330,322 385,385 415,440;
                330,322 375,392 405,465;
                330,322 365,400 380,475"/>
    </polyline>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.4s"
                        repeatCount="indefinite" calcMode="linear"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="380,475; 355,465; 345,440; 355,415; 380,405;
                                405,415; 415,440; 405,465; 380,475"/>
      <rect x="-18" y="14" width="38" height="7" rx="2" fill="#2b2f34"/>
      <path d="M -14 0 L 34 4 L 34 12 L -12 14 Q -22 7 -14 0 Z"
            fill="#e08c0d" stroke="#b06d07" stroke-width="2"/>
      <path d="M 6 3 L 4 13 M 18 4 L 16 13" stroke="#b06d07" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- ================= FRAME ================= -->
  <g fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round">
    <line x1="280" y1="440" x2="320" y2="330"/>   <!-- seat stay -->
    <line x1="280" y1="440" x2="380" y2="440"/>   <!-- chain stay -->
    <line x1="320" y1="330" x2="380" y2="440"/>   <!-- seat tube -->
    <line x1="320" y1="330" x2="490" y2="330"/>   <!-- top tube -->
    <line x1="380" y1="440" x2="490" y2="330"/>   <!-- down tube -->
    <line x1="490" y1="330" x2="520" y2="440"/>   <!-- fork -->
    <line x1="487" y1="325" x2="496" y2="344"/>   <!-- head tube -->
    <line x1="492" y1="330" x2="502" y2="311"/>   <!-- stem -->
  </g>
  <path d="M 502 311 Q 517 304 524 317" fill="none" stroke="#2b2f34"
        stroke-width="9" stroke-linecap="round"/>

  <!-- chain -->
  <g stroke="#4a4f56" stroke-width="4" fill="none">
    <line x1="380" y1="410" x2="283" y2="428"/>
    <line x1="380" y1="470" x2="283" y2="452"/>
  </g>
  <circle cx="280" cy="440" r="13" fill="none" stroke="#5b6470" stroke-width="5"/>

  <!-- ================= CRANK ================= -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 380 440" to="360 380 440" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="380" cy="440" r="30" fill="none" stroke="#3a3f45" stroke-width="6"/>
    <line x1="380" y1="440" x2="380" y2="405" stroke="#2b2f34" stroke-width="8" stroke-linecap="round"/>
    <line x1="380" y1="440" x2="380" y2="475" stroke="#2b2f34" stroke-width="8" stroke-linecap="round"/>
    <circle cx="380" cy="440" r="9" fill="#5b6470"/>
  </g>

  <!-- ================= SADDLE ================= -->
  <path d="M 298 336 Q 322 324 350 330 Q 352 341 332 343 L 306 343 Q 295 342 298 336 Z"
        fill="#22262b"/>

  <!-- ================= PELICAN ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.4s"
                      repeatCount="indefinite" calcMode="linear"
                      keyTimes="0;0.25;0.5;0.75;1"
                      values="0 0; 0 -3; 0 0; 0 2; 0 0"/>

    <!-- tail -->
    <path d="M 308 252 C 286 236 262 232 244 242 C 264 251 284 262 300 274 Z"
          fill="#e4ebf1" stroke="#cbd5de" stroke-width="2"/>

    <!-- body -->
    <ellipse cx="370" cy="272" rx="92" ry="62" transform="rotate(-8 370 272)"
             fill="url(#bodyGrad)" stroke="#c9d4de" stroke-width="2"/>
    <!-- far wing shading -->
    <path d="M 330 300 Q 372 320 420 300" fill="none" stroke="#d5dee6" stroke-width="7"
          stroke-linecap="round" opacity="0.8"/>

    <!-- neck -->
    <path d="M 430 250 C 452 232 462 214 470 198" fill="none" stroke="#ffffff"
          stroke-width="34" stroke-linecap="round"/>
    <path d="M 430 250 C 452 232 462 214 470 198" fill="none" stroke="#e7eef4"
          stroke-width="34" stroke-linecap="round" opacity="0.35"
          transform="translate(4,4)"/>

    <!-- head group -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2.8s"
                        repeatCount="indefinite" calcMode="linear"
                        keyTimes="0;0.3;0.55;0.8;1"
                        values="0 470 198; 2 470 198; 0 470 198; -1.5 470 198; 0 470 198"/>

      <!-- pouch -->
      <path d="M 504 176 C 545 252 602 236 616 192 C 570 212 530 200 504 176 Z"
            fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="2"/>
      <!-- upper beak -->
      <path d="M 502 156 Q 566 160 617 184 Q 566 190 502 178 Z"
            fill="#fbbf24" stroke="#d9930d" stroke-width="2"/>
      <!-- head -->
      <ellipse cx="478" cy="168" rx="33" ry="29" fill="#ffffff" stroke="#c9d4de" stroke-width="2"/>
      <!-- eye -->
      <ellipse cx="492" cy="158" rx="5.5" ry="5.5" fill="#25282c">
        <animate attributeName="ry" dur="4s" repeatCount="indefinite" calcMode="linear"
                 keyTimes="0;0.9;0.93;0.96;1" values="5.5;5.5;0.6;5.5;5.5"/>
      </ellipse>
      <circle cx="494" cy="156" r="1.8" fill="#ffffff"/>
      <!-- cycling cap -->
      <path d="M 447 170 Q 476 128 513 164 L 515 177 Q 477 150 446 180 Z" fill="#2f80ed"/>
      <path d="M 510 163 L 540 171 L 513 179 Z" fill="#1c5fb8"/>
      <path d="M 452 176 L 470 197" stroke="#2f80ed" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- wing reaching the handlebar -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.4s"
                        repeatCount="indefinite" calcMode="linear"
                        keyTimes="0;0.25;0.5;0.75;1"
                        values="0 418 252; -3 418 252; 0 418 252; 2 418 252; 0 418 252"/>
      <path d="M 418 252 Q 475 268 516 310" fill="none" stroke="#d8e2ea"
            stroke-width="30" stroke-linecap="round"/>
      <path d="M 418 252 Q 475 268 516 310" fill="none" stroke="#ffffff"
            stroke-width="24" stroke-linecap="round"/>
      <ellipse cx="519" cy="314" rx="15" ry="11" transform="rotate(35 519 314)"
               fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/>
    </g>
  </g>

  <!-- ================= NEAR LEG (in front) ================= -->
  <g>
    <polyline points="335,325 378,372 380,405" fill="none" stroke="#f59e0b"
              stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="points" dur="1.4s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="335,325 378,372 380,405;
                335,325 385,375 405,415;
                335,325 385,385 415,440;
                335,325 375,392 405,465;
                335,325 365,400 380,475;
                335,325 350,400 355,465;
                335,325 345,395 345,440;
                335,325 358,385 355,415;
                335,325 378,372 380,405"/>
    </polyline>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.4s"
                        repeatCount="indefinite" calcMode="linear"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        values="380,405; 405,415; 415,440; 405,465; 380,475;
                                355,465; 345,440; 355,415; 380,405"/>
      <rect x="-18" y="14" width="38" height="7" rx="2" fill="#2b2f34"/>
      <path d="M -14 0 L 34 4 L 34 12 L -12 14 Q -22 7 -14 0 Z"
            fill="#f59e0b" stroke="#c97a06" stroke-width="2"/>
      <path d="M 6 3 L 4 13 M 18 4 L 16 13" stroke="#c97a06" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>