<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda Garden</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
canvas{display:block}
#ui{position:absolute;top:15px;left:15px;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;background:rgba(0,0,0,.65);padding:12px 16px;border-radius:10px;pointer-events:none;line-height:1.7;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.1)}
#ui h3{margin:0 0 4px;font-size:16px;color:#FFD700;letter-spacing:1px}
#ui .hint{color:rgba(255,255,255,.7);font-size:12px}
#stats{position:absolute;bottom:15px;right:15px;color:rgba(255,255,255,.5);font-family:monospace;font-size:11px;pointer-events:none}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-family:'Segoe UI',sans-serif;font-size:24px;z-index:100;text-align:center}
</style>
</head>
<body>
<div id="loading">🌸 Building Voxel Garden…</div>
<div id="ui"><h3>🌸 Voxel Pagoda Garden</h3><div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div></div>
<div id="stats"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════
   SCENE SETUP
   ═══════════════════════════════════════════ */
const scene = new THREE.Scene();

// Sky gradient
const skyC = document.createElement('canvas');
skyC.width = 512; skyC.height = 512;
const skyX = skyC.getContext('2d');
const skyG = skyX.createLinearGradient(0,0,0,512);
skyG.addColorStop(0,'#0d1b2a');
skyG.addColorStop(.15,'#1b4f72');
skyG.addColorStop(.45,'#4a90d9');
skyG.addColorStop(.7,'#87CEEB');
skyG.addColorStop(.85,'#FFE0B2');
skyG.addColorStop(1,'#FFCC80');
skyX.fillStyle = skyG;
skyX.fillRect(0,0,512,512);
scene.background = new THREE.CanvasTexture(skyC);
scene.fog = new THREE.Fog(0xD8E8F0, 70, 180);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
camera.position.set(55, 50, 55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x606090, .7));
const sun = new THREE.DirectionalLight(0xFFF5E0, 1.5);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 250;
const sc = 75;
Object.assign(sun.shadow.camera, {left:-sc, right:sc, top:sc, bottom:-sc});
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8080FF, .4);
fill.position.set(-40, 50, -30);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xFFE0B2, .3);
rim.position.set(-20, 30, 60);
scene.add(rim);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 22, 0);
controls.enableDamping = true;
controls.dampingFactor = .05;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 15;
controls.maxDistance = 160;
controls.autoRotate = true;
controls.autoRotateSpeed = .3;
renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);

/* ═══════════════════════════════════════════
   VOXEL SYSTEM
   ═══════════════════════════════════════════ */
const voxels = new Map();
function V(x,y,z,c){ voxels.set(`${Math.round(x)},${Math.round(y)},${Math.round(z)}`, c); }
function pr(x,z){ const n = Math.sin(x*12.9898+z*78.233)*43758.5453; return n-Math.floor(n); }
function pick(arr,x,z){ return arr[Math.floor(pr(x,z)*arr.length)]; }

/* ═══════════════════════════════════════════
   BUILD: GROUND
   ═══════════════════════════════════════════ */
function buildGround(){
  const S=80, H=S/2;
  const grass=['#4CAF50','#66BB6A','#81C784','#388E3C','#2E7D32','#558B2F','#7CB342','#43A047','#6B8E23'];
  for(let x=-H;x<H;x++) for(let z=-H;z<H;z++) V(x,0,z,pick(grass,x,z));
  // Sand circle around pagoda
  const sand=['#D4C5A9','#C8B896','#BCA97D','#D2C4A0','#CCC0A8'];
  for(let x=-14;x<=14;x++) for(let z=-14;z<=14;z++)
    if(Math.sqrt(x*x+z*z)<=14) V(x,0,z,pick(sand,x+100,z+100));
}

/* ═══════════════════════════════════════════
   BUILD: PAGODA
   ═══════════════════════════════════════════ */
function buildPagoda(cx,cz){
  const BH=9;
  // Foundation
  for(let x=-BH;x<=BH;x++) for(let z=-BH;z<=BH;z++){
    V(cx+x,0,cz+z,'#757575'); V(cx+x,1,cz+z,'#9E9E9E'); V(cx+x,2,cz+z,'#A0A0A0');
  }
  // Steps (south)
  for(let i=0;i<3;i++){
    const sz=BH+1+i, sy=2-i;
    for(let x=-2;x<=2;x++) for(let y=0;y<=sy;y++) V(cx+x,y,cz+sz,'#8D8D8D');
  }

  const tiers=[
    {w:13,h:7,oh:2,rh:3},
    {w:11,h:6,oh:2,rh:3},
    {w:9, h:6,oh:2,rh:3},
    {w:7, h:5,oh:2,rh:3},
    {w:5, h:5,oh:2,rh:3},
  ];
  let y=3;
  for(let i=0;i<tiers.length;i++){
    const t=tiers[i], hw=Math.floor(t.w/2);
    // Floor
    for(let x=-hw;x<=hw;x++) for(let z=-hw;z<=hw;z++) V(cx+x,y,cz+z,'#5D4037');
    // Walls
    for(let wy=y;wy<y+t.h;wy++){
      const ly=wy-y;
      for(let x=-hw;x<=hw;x++) for(let z=-hw;z<=hw;z++){
        if(Math.abs(x)!==hw && Math.abs(z)!==hw) continue;
        const corner=Math.abs(x)===hw&&Math.abs(z)===hw;
        const doorS=i===0&&z===hw&&Math.abs(x)<=1&&ly<=3;
        const doorN=i===0&&z===-hw&&Math.abs(x)<=1&&ly<=3;
        const win=(Math.abs(x)===hw&&Math.abs(z)>=2&&Math.abs(z)<=3&&ly>=2&&ly<=4)||
                  (Math.abs(z)===hw&&Math.abs(x)>=2&&Math.abs(x)<=3&&ly>=2&&ly<=4);
        let c;
        if(corner) c='#7B241C';
        else if(doorS||doorN) c='#1A1A1A';
        else if(win) c='#1A2A3A';
        else if(ly===0) c='#A93226';
        else if(ly===t.h-1) c='#FFD700';
        else if(ly===Math.floor(t.h/2)) c='#C0392B';
        else c='#E74C3C';
        V(cx+x,wy,cz+z,c);
      }
    }
    // Ceiling (interior of top wall row)
    for(let x=-hw+1;x<=hw-1;x++) for(let z=-hw+1;z<=hw-1;z++)
      V(cx+x,y+t.h-1,cz+z,'#5D4037');
    // Roof
    const ry0=y+t.h;
    for(let layer=0;layer<t.rh;layer++){
      const rh=hw+t.oh-layer, ry=ry0+layer;
      for(let x=-rh;x<=rh;x++) for(let z=-rh;z<=rh;z++){
        const edge=Math.abs(x)===rh||Math.abs(z)===rh;
        const cor=Math.abs(x)===rh&&Math.abs(z)===rh;
        let c;
        if(cor&&layer===0) c='#F4D03F';
        else if(edge) c='#154360';
        else c=layer===0?'#1B4F72':'#1A5276';
        V(cx+x,ry,cz+z,c);
      }
      if(layer===0){
        V(cx-rh,ry+1,cz-rh,'#F4D03F'); V(cx+rh,ry+1,cz-rh,'#F4D03F');
        V(cx-rh,ry+1,cz+rh,'#F4D03F'); V(cx+rh,ry+1,cz+rh,'#F4D03F');
      }
    }
    // Gold ridge
    const ty=ry0+t.rh-1, th=hw+t.oh-(t.rh-1);
    for(let x=-th;x<=th;x++) V(cx+x,ty,cz,'#FFD700');
    for(let z=-th;z<=th;z++) V(cx,ty,cz+z,'#FFD700');
    y=ry0+t.rh;
  }
  // Interior altar
  V(cx,4,cz,'#FFD700'); V(cx,5,cz,'#FFD700');
  V(cx-1,4,cz,'#FFA500'); V(cx+1,4,cz,'#FFA500');
  V(cx,4,cz-1,'#FFA500'); V(cx,4,cz+1,'#FFA500');
  // Spire
  for(let x=-1;x<=1;x++) for(let z=-1;z<=1;z++) V(cx+x,y,cz+z,'#FFD700');
  for(let i=1;i<=7;i++){
    V(cx,y+i,cz,'#FFD700');
    V(cx+1,y+i,cz,'#FFA500'); V(cx-1,y+i,cz,'#FFA500');
    V(cx,y+i,cz+1,'#FFA500'); V(cx,y+i,cz-1,'#FFA500');
  }
  [2,4,6].forEach(o=>{
    const ry=y+o;
    for(let x=-2;x<=2;x++) for(let z=-2;z<=2;z++)
      if(Math.abs(x)===2||Math.abs(z)===2) V(cx+x,ry,cz+z,'#FFD700');
  });
  V(cx,y+8,cz,'#FFD700'); V(cx,y+9,cz,'#FFA500');
}

/* ═══════════════════════════════════════════
   BUILD: PATH
   ═══════════════════════════════════════════ */
function buildPath(){
  const cols=['#9E9E9E','#BDBDBD','#808080','#A0A0A0','#757575','#CCCCCC'];
  for(let t=0;t<=1;t+=.003){
    const z=Math.round(35-t*22), x=Math.round(Math.sin(t*Math.PI*3)*4);
    for(let w=-3;w<=3;w++)
      V(x+w,0,z, Math.abs(w)===3 ? '#757575' : pick(cols,x+w*7,z*3));
  }
}

/* ═══════════════════════════════════════════
   BUILD: POND
   ═══════════════════════════════════════════ */
function buildPond(cx,cz,w,h){
  const hw=Math.floor(w/2), hh=Math.floor(h/2);
  const water=['#1565C0','#1976D2','#2196F3','#42A5F5','#1E88E5','#0D47A1'];
  const bank=['#795548','#8D6E63','#6D4C41'];
  for(let x=-hw;x<=hw;x++) for(let z=-hh;z<=hh;z++){
    const d=Math.sqrt((x/hw)**2+(z/hh)**2), n=pr(x+cx*3,z+cz*7)*.3;
    if(d+n<=1.0){
      V(cx+x,0,cz+z,pick(water,x*3+cx,z*7+cz));
      if(pr(x+200,z+200)>.94) V(cx+x,1,cz+z,'#FF6D00');
    } else if(d+n<=1.2){
      V(cx+x,0,cz+z,pick(bank,x+50,z+50));
    }
  }
  // Lily pads
  [[-3,-2],[4,3],[0,5],[-5,4],[3,-4]].forEach(([px,pz])=>{
    if(Math.sqrt((px/hw)**2+(pz/hh)**2)<.7)
      for(let x=-1;x<=1;x++) for(let z=-1;z<=1;z++)
        if(Math.abs(x)+Math.abs(z)<=1) V(cx+px+x,1,cz+pz+z,'#4CAF50');
  });
}

/* ═══════════════════════════════════════════
   BUILD: BRIDGE
   ═══════════════════════════════════════════ */
function buildBridge(cx,cz,len,dir){
  const h=Math.floor(len/2), dy=2;
  for(let i=-h;i<=h;i++){
    for(let w=-1;w<=1;w++){
      if(dir==='ew') V(cx+i,dy,cz+w,'#D84315'); else V(cx+w,dy,cz+i,'#D84315');
    }
    for(const s of[-2,2]){
      if(dir==='ew'){ V(cx+i,dy+1,cz+s,'#BF360C'); if(i%3===0) V(cx+i,dy+2,cz+s,'#D84315'); }
      else { V(cx+s,dy+1,cz+i,'#BF360C'); if(i%3===0) V(cx+s,dy+2,cz+i,'#D84315'); }
    }
  }
  for(let i=-2;i<=2;i+=4) for(let y=0;y<dy;y++){
    if(dir==='ew'){ V(cx+i,y,cz-1,'#5D4037'); V(cx+i,y,cz+1,'#5D4037'); }
    else { V(cx-1,y,cz+i,'#5D4037'); V(cx+1,y,cz+i,'#5D4037'); }
  }
}

/* ═══════════════════════════════════════════
   BUILD: TREES
   ═══════════════════════════════════════════ */
function trunk(cx,cz,h){
  for(let y=1;y<=h;y++){
    const c=y<=Math.floor(h*.6)?'#5D4037':'#4E342E';
    V(cx,y,cz,c); V(cx+1,y,cz,c); V(cx,y,cz+1,c); V(cx+1,y,cz+1,c);
  }
}

function buildCherryTree(cx,cz,h,r){
  trunk(cx,cz,h);
  // Branches
  const by=Math.floor(h*.7);
  [[3,0],[-3,0],[0,3],[0,-3],[2,2],[-2,-2],[2,-2],[-2,2]].forEach(([dx,dz])=>{
    const l=Math.max(Math.abs(dx),Math.abs(dz));
    for(let i=1;i<=l;i++) V(cx+Math.round(dx*i/l),by+Math.floor(i*.5),cz+Math.round(dz*i/l),'#4E342E');
  });
  // Canopy
  const cy=h+Math.floor(r*.3);
  const cols=['#FFB7C5','#FF69B4','#FFC0CB','#FFB6C1','#FF1493','#FFC1E3','#FF80AB'];
  for(let x=-r;x<=r;x++) for(let y=-r;y<=r;y++) for(let z=-r;z<=r;z++){
    const d=Math.sqrt(x*x+y*y+z*z);
    const n=Math.sin(x*1.7+z*2.3)*.5+Math.cos(y*1.3)*.3;
    if(d+n<=r) V(cx+x,cy+y,cz+z,cols[Math.floor(Math.abs(Math.sin(x*7.3+y*3.1+z*11.7)*1e4)%cols.length)]);
  }
}

function buildGreenTree(cx,cz,h,r){
  trunk(cx,cz,h);
  const cy=h+Math.floor(r*.3);
  const cols=['#43A047','#388E3C','#2E7D32','#66BB6A','#81C784','#558B2F'];
  for(let x=-r;x<=r;x++) for(let y=-r;y<=r;y++) for(let z=-r;z<=r;z++){
    const d=Math.sqrt(x*x+y*y+z*z), n=Math.sin(x*2.1+z*1.7)*.3;
    if(d+n<=r) V(cx+x,cy+y,cz+z,cols[Math.floor(Math.abs(Math.sin(x*5.7+y*3.3+z*9.1)*1e4)%cols.length)]);
  }
}

function buildPineTree(cx,cz,h){
  trunk(cx,cz,h);
  const cols=['#1B5E20','#0D3010','#2E7D32','#145A32','#33691E'];
  const fs=Math.floor(h*.3), ft=h+Math.floor(h*.6);
  for(let y=fs;y<=ft;y++){
    const t=(y-fs)/(ft-fs), mr=Math.round((1-t)*4+1);
    for(let x=-mr;x<=mr;x++) for(let z=-mr;z<=mr;z++)
      if(Math.sqrt(x*x+z*z)<=mr) V(cx+x,y,cz+z,cols[Math.floor(Math.abs(Math.sin(x*3.7+y*2.1+z*5.3)*1e4)%cols.length)]);
  }
}

/* ═══════════════════════════════════════════
   BUILD: DECORATIONS
   ═══════════════════════════════════════════ */
function buildLantern(cx,cz){
  for(let x=0;x<=1;x++) for(let z=0;z<=1;z++) V(cx+x,1,cz+z,'#757575');
  for(let y=2;y<=5;y++){ V(cx,y,cz,'#9E9E9E'); V(cx+1,y,cz,'#9E9E9E'); V(cx,y,cz+1,'#9E9E9E'); V(cx+1,y,cz+1,'#9E9E9E'); }
  V(cx,6,cz,'#FFF9C4'); V(cx+1,6,cz,'#FFF9C4'); V(cx,6,cz+1,'#FFF9C4'); V(cx+1,6,cz+1,'#FFF9C4');
  for(let x=-1;x<=2;x++) for(let z=-1;z<=2;z++) V(cx+x,7,cz+z,'#616161');
  for(let x=0;x<=1;x++) for(let z=0;z<=1;z++) V(cx+x,8,cz+z,'#616161');
  V(cx,9,cz,'#616161'); V(cx+1,9,cz,'#616161'); V(cx,9,cz+1,'#616161'); V(cx+1,9,cz+1,'#616161');
}

function buildTorii(cx,cz){
  for(let y=0;y<=7;y++){ V(cx-3,y,cz,'#D32F2F'); V(cx+3,y,cz,'#D32F2F'); }
  for(let x=-3;x<=3;x++) V(cx+x,5,cz,'#D32F2F');
  for(let x=-5;x<=5;x++){ V(cx+x,8,cz,'#D32F2F'); V(cx+x,7,cz,'#1A1A1A'); }
  V(cx-5,9,cz,'#D32F2F'); V(cx+5,9,cz,'#D32F2F');
  V(cx-6,8,cz,'#D32F2F'); V(cx+6,8,cz,'#D32F2F');
}

function buildFlowers(cx,cz,n){
  const cols=['#FF0000','#FFEB3B','#9C27B0','#FFFFFF','#FF9800','#E91E63','#7B1FA2','#FF5722'];
  for(let i=0;i<n;i++){
    const a=pr(cx+i,cz+i*7)*Math.PI*2, r=pr(cx+i*3,cz+i*11)*5;
    const fx=Math.round(cx+Math.cos(a)*r), fz=Math.round(cz+Math.sin(a)*r);
    const c=pick(cols,fx*13,fz*17);
    V(fx,1,fz,c);
    if(pr(fx,fz)>.5) V(fx,2,fz,c);
  }
}

function buildRock(cx,cz,s){
  const cols=['#78909C','#546E7A','#607D8B','#455A64'];
  for(let x=-s;x<=s;x++) for(let y=0;y<=s;y++) for(let z=-s;z<=s;z++){
    const d=Math.sqrt(x*x+y*y+z*z), n=pr(cx+x,cz+z+y*10)*.5;
    if(d+n<=s+.5) V(cx+x,y,cz+z,pick(cols,x*7+cx,z*3+cz));
  }
}

function buildBush(cx,cz,r){
  const cols=['#388E3C','#2E7D32','#43A047','#558B2F','#689F38'];
  for(let x=-r;x<=r;x++) for(let y=0;y<=r;y++) for(let z=-r;z<=r;z++){
    const d=Math.sqrt(x*x+y*y+z*z), n=Math.sin(x*1.5+z*2.1)*.3;
    if(d+n<=r) V(cx+x,y+1,cz+z,cols[Math.floor(Math.abs(Math.sin(x*5.1+y*3.7+z*7.3)*1e4)%cols.length)]);
  }
}

function buildBamboo(cx,cz,h){
  for(let y=1;y<=h;y++) V(cx,y,cz, y%3===0?'#33691E':'#558B2F');
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2, lx=Math.round(Math.cos(a)*2), lz=Math.round(Math.sin(a)*2);
    V(cx+lx,h,cz+lz,'#7CB342'); V(cx+lx,h+1,cz+lz,'#8BC34A');
  }
}

function buildBambooCluster(cx,cz,n){
  for(let i=0;i<n;i++){
    const bx=cx+Math.round(pr(cx+i,cz)*4-2), bz=cz+Math.round(pr(cx,cz+i)*4-2);
    buildBamboo(bx,bz,10+Math.floor(pr(bx,bz)*5));
  }
}

function buildReeds(cx,cz,r){
  for(let i=0;i<12;i++){
    const a=pr(cx+i,cz+i*7)*Math.PI*2, rr=r+pr(cx+i*3,cz+i*11)*3;
    const rx=Math.round(cx+Math.cos(a)*rr), rz=Math.round(cz+Math.sin(a)*rr);
    const h=3+Math.floor(pr(rx,rz)*3);
    for(let y=1;y<=h;y++) V(rx,y,rz, y<=h-1?'#558B2F':'#7CB342');
  }
}

/* ═══════════════════════════════════════════
   SCENE ASSEMBLY
   ═══════════════════════════════════════════ */
buildGround();
buildPath();
buildPagoda(0, 0);
buildPond(25, 20, 18, 14);
buildBridge(25, 20, 16, 'ew');
buildReeds(25, 20, 10);

// Cherry blossom trees
buildCherryTree(-18,-12, 7, 5);
buildCherryTree( 18,-15, 6, 4);
buildCherryTree(-22, 15, 8, 5);
buildCherryTree( 12, 28, 7, 5);
buildCherryTree(-10, 30, 6, 4);
buildCherryTree( 30, -5, 7, 5);
buildCherryTree(-25, -2, 6, 4);

// Green trees
buildGreenTree(-30,-25, 7, 5);
buildGreenTree( 30,-25, 8, 5);
buildGreenTree(-35,  5, 6, 4);
buildGreenTree( 34,  5, 7, 5);
buildGreenTree(-30, 30, 7, 5);
buildGreenTree( 30, 35, 6, 4);
buildGreenTree( 15,-30, 7, 5);
buildGreenTree(-15,-30, 6, 4);

// Pine trees
buildPineTree(-20,-35,10);
buildPineTree( 20,-35,12);
buildPineTree( 35,-15, 9);
buildPineTree(-35,-15,11);

// Bamboo clusters
buildBambooCluster(-32,-18, 5);
buildBambooCluster( 37, 30, 5);

// Lanterns along path
buildLantern( 6, 30);
buildLantern(-2, 33);
buildLantern( 4, 22);
buildLantern(-6, 17);

// Torii gate
buildTorii(0, 35);

// Flowers
buildFlowers(-8, 20, 15);
buildFlowers( 8, 25, 15);
buildFlowers(-15, 5, 10);
buildFlowers( 15, 10, 10);
buildFlowers( 0, 30, 10);
buildFlowers(-12,-8, 8);
buildFlowers( 18, 15, 8);

/* ═══════════════════════════════════════════
   RENDER VOXELS
   ═══════════════════════════════════════════ */
function renderVoxels(){
  const groups = new Map();
  for(const [key,color] of voxels){
    const [x,y,z] = key.split(',').map(Number);
    if(!groups.has(color)) groups.set(color, []);
    groups.get(color).push([x,y,z]);
  }
  const geo = new THREE.BoxGeometry(.96,.96,.96);
  const mtx = new THREE.Matrix4();
  for(const [color, positions] of groups){
    const mat = new THREE.MeshLambertMaterial({color: parseInt(color.replace('#',''),16)});
    const mesh = new THREE.InstancedMesh(geo, mat, positions.length);
    for(let i=0;i<positions.length;i++){
      mtx.setPosition(positions[i][0], positions[i][1], positions[i][2]);
      mesh.setMatrixAt(i, mtx);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
  document.getElementById('stats').textContent = `${voxels.size.toLocaleString()} voxels · ${groups.size} colors`;
}
renderVoxels();

/* ═══════════════════════════════════════════
   FALLING CHERRY BLOSSOM PETALS
   ═══════════════════════════════════════════ */
const petalCount = 130;
const petalGeo = new THREE.BoxGeometry(.3, .1, .3);
const petalMat = new THREE.MeshLambertMaterial({color: 0xFFB7C5});
const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, petalCount);
scene.add(petalMesh);

const cherryTrees = [[-18,-12],[18,-15],[-22,15],[12,28],[-10,30],[30,-5],[-25,-2]];
const petalData = [];
for(let i=0;i<petalCount;i++){
  const ti = Math.floor(Math.random()*cherryTrees.length);
  const [tx,tz] = cherryTrees[ti];
  petalData.push({
    x: tx+(Math.random()-.5)*20,
    y: Math.random()*45+10,
    z: tz+(Math.random()-.5)*20,
    fall: .01+Math.random()*.03,
    drift: .005+Math.random()*.015,
    phase: Math.random()*Math.PI*2,
    rot: .02+Math.random()*.06,
    rotOff: Math.random()*Math.PI*2,
  });
}

/* ═══════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════ */
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Animate petals
  for(let i=0;i<petalCount;i++){
    const p = petalData[i];
    p.y -= p.fall;
    p.x += Math.sin(p.phase + t*.5) * p.drift;
    p.z += Math.cos(p.phase + t*.3) * p.drift;
    if(p.y < 0){
      const ti = Math.floor(Math.random()*cherryTrees.length);
      const [tx,tz] = cherryTrees[ti];
      p.x = tx+(Math.random()-.5)*20;
      p.y = 45+Math.random()*10;
      p.z = tz+(Math.random()-.5)*20;
    }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rotOff+t*p.rot, p.phase+t*p.rot*.7, t*p.rot*.5);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════
   RESIZE + START
   ═══════════════════════════════════════════ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('loading').style.display = 'none';
animate();
</script>
