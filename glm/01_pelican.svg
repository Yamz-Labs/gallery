<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
  <title id="t">A pelican riding a bicycle</title>
  <desc id="d">Animated cartoon: a pelican pedals a bicycle along a country road.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeafd"/>
      <stop offset="1" stop-color="#f0faff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="38" ry="15" fill="#ffffff"/>
      <circle cx="-16" cy="-9" r="15" fill="#ffffff"/>
      <circle cx="9" cy="-11" r="17" fill="#ffffff"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="82" cy="76" r="40" fill="#ffe28a" opacity="0.35"/>
  <circle cx="82" cy="76" r="28" fill="#ffd75e"/>

  <!-- drifting clouds -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="26s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" transform="translate(150,90)"/>
    <use xlink:href="#cloud" transform="translate(950,150) scale(0.8)"/>
  </g>
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="44s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" transform="translate(430,40) scale(0.7)"/>
    <use xlink:href="#cloud" transform="translate(1230,40) scale(0.7)"/>
  </g>

  <!-- hills -->
  <path d="M0,452 Q130,398 280,446 Q420,470 560,438 Q690,414 800,446 L800,452 L0,452 Z" fill="#a8cf87"/>

  <!-- trees -->
  <g>
    <rect x="56" y="376" width="9" height="48" rx="3" fill="#8a5a33"/>
    <circle cx="60" cy="348" r="24" fill="#5d9c52"/>
    <circle cx="45" cy="362" r="14" fill="#5d9c52"/>
    <circle cx="75" cy="362" r="13" fill="#5d9c52"/>
  </g>
  <g>
    <rect x="716" y="378" width="9" height="46" rx="3" fill="#8a5a33"/>
    <circle cx="720" cy="350" r="26" fill="#5d9c52"/>
    <circle cx="705" cy="364" r="15" fill="#5d9c52"/>
    <circle cx="735" cy="364" r="14" fill="#5d9c52"/>
  </g>

  <!-- grass + road -->
  <rect x="0" y="446" width="800" height="6" fill="#7fae5f"/>
  <rect x="0" y="450" width="800" height="50" fill="#565a5e"/>
  <line x1="-60" y1="476" x2="860" y2="476" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="34 26">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.17s" repeatCount="indefinite"/>
  </line>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="352" x2="190" y2="352" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-34 0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="398" x2="186" y2="398" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.7s" begin="0.35s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-34 0" dur="0.7s" begin="0.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <ellipse cx="432" cy="452" rx="165" ry="9" fill="#000000" opacity="0.15"/>

  <!-- far leg (behind the frame) -->
  <g>
    <path fill="none" stroke="#c97b33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          d="M415,265 L464.45,321.41 L412,375">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M415,265 L464.45,321.41 L412,375;
                M415,265 L477.36,306.65 L420.2,355.2;
                M415,265 L486.35,288.11 L440,347;
                M415,265 L487.19,285.37 L459.8,355.2;
                M415,265 L480.75,301.1 L468,375;
                M415,265 L465.89,320.1 L459.8,394.8;
                M415,265 L453.64,329.26 L440,403;
                M415,265 L455.04,328.44 L420.2,394.8;
                M415,265 L464.45,321.41 L412,375"/>
    </path>
    <g>
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M412,375 A28,28 0 1 1 468,375 A28,28 0 1 1 412,375 Z"/>
      <ellipse cx="0" cy="0" rx="10" ry="5" fill="#c97b33"/>
    </g>
  </g>

  <!-- bicycle -->
  <g>
    <!-- rear wheel -->
    <g>
      <circle cx="300" cy="380" r="70" fill="none" stroke="#262626" stroke-width="9"/>
      <circle cx="300" cy="380" r="60" fill="none" stroke="#9aa0a6" stroke-width="3"/>
      <g stroke="#aab2b8" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 300 380" to="360 300 380" dur="1.2s" repeatCount="indefinite"/>
        <line x1="240" y1="380" x2="360" y2="380"/>
        <line x1="300" y1="320" x2="300" y2="440"/>
        <line x1="257.6" y1="337.6" x2="342.4" y2="422.4"/>
        <line x1="342.4" y1="337.6" x2="257.6" y2="422.4"/>
      </g>
      <circle cx="300" cy="380" r="6" fill="#3a3a3a"/>
    </g>
    <!-- front wheel -->
    <g>
      <circle cx="560" cy="380" r="70" fill="none" stroke="#262626" stroke-width="9"/>
      <circle cx="560" cy="380" r="60" fill="none" stroke="#9aa0a6" stroke-width="3"/>
      <g stroke="#aab2b8" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 560 380" to="360 560 380" dur="1.2s" repeatCount="indefinite"/>
        <line x1="500" y1="380" x2="620" y2="380"/>
        <line x1="560" y1="320" x2="560" y2="440"/>
        <line x1="517.6" y1="337.6" x2="602.4" y2="422.4"/>
        <line x1="602.4" y1="337.6" x2="517.6" y2="422.4"/>
      </g>
      <circle cx="560" cy="380" r="6" fill="#3a3a3a"/>
    </g>

    <!-- chain -->
    <line x1="440" y1="362" x2="300" y2="374" stroke="#333" stroke-width="3" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-9" dur="0.13s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="386" x2="440" y2="388" stroke="#333" stroke-width="3" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" from="0" to="9" dur="0.13s" repeatCount="indefinite"/>
    </line>
    <circle cx="300" cy="380" r="7" fill="none" stroke="#333" stroke-width="3"/>

    <!-- frame -->
    <path d="M300,380 L405,300 L545,285 L440,375 Z M300,380 L440,375 M560,380 L545,285"
          fill="none" stroke="#d9452f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- seat and handlebar -->
    <line x1="402" y1="298" x2="398" y2="290" stroke="#333" stroke-width="5"/>
    <ellipse cx="398" cy="288" rx="17" ry="6" fill="#3b2f2f"/>
    <path d="M545,285 L562,272" stroke="#262626" stroke-width="6" stroke-linecap="round"/>
    <circle cx="564" cy="270" r="5" fill="#333"/>

    <!-- basket with baguette -->
    <g>
      <rect x="548" y="282" width="34" height="20" rx="3" fill="#b5893f" stroke="#8a5a33" stroke-width="2"/>
      <line x1="559" y1="282" x2="559" y2="302" stroke="#8a5a33" stroke-width="1.5"/>
      <line x1="571" y1="282" x2="571" y2="302" stroke="#8a5a33" stroke-width="1.5"/>
      <ellipse cx="576" cy="256" rx="16" ry="5" fill="#d9a55f" transform="rotate(-25 576 256)"/>
      <path d="M566,250 L572,246 M574,252 L580,248" stroke="#b07f42" stroke-width="1.5"/>
    </g>

    <!-- chainring -->
    <circle cx="440" cy="375" r="15" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="440" cy="375" r="11" fill="none" stroke="#333" stroke-width="3"/>

    <!-- crank + pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 440 375" to="360 440 375" dur="1.2s" repeatCount="indefinite"/>
      <line x1="412" y1="375" x2="468" y2="375" stroke="#333" stroke-width="5"/>
      <g transform="translate(468,375)">
        <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-11" y="-5" width="22" height="10" rx="2" fill="#222"/>
      </g>
      <g transform="translate(412,375)">
        <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-11" y="-5" width="22" height="10" rx="2" fill="#222"/>
      </g>
    </g>
  </g>

  <!-- near leg (in front of the frame) -->
  <g>
    <path fill="none" stroke="#f59f45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M415,265 L480.75,301.1 L468,375">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M415,265 L480.75,301.1 L468,375;
                M415,265 L465.89,320.1 L459.8,394.8;
                M415,265 L453.64,329.26 L440,403;
                M415,265 L455.04,328.44 L420.2,394.8;
                M415,265 L464.45,321.41 L412,375;
                M415,265 L477.36,306.65 L420.2,355.2;
                M415,265 L486.35,288.11 L440,347;
                M415,265 L487.19,285.37 L459.8,355.2;
                M415,265 L480.75,301.1 L468,375"/>
    </path>
    <g>
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M468,375 A28,28 0 1 1 412,375 A28,28 0 1 1 468,375 Z"/>
      <ellipse cx="0" cy="0" rx="11" ry="5" fill="#f59f45"/>
    </g>
  </g>

  <!-- pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0;0 -3;0 0"
                      keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>

    <!-- tail -->
    <path d="M356,242 L318,254 L332,232 Z" fill="#f7f3ea" stroke="#9aa7b0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M360,254 L326,270 L340,248 Z" fill="#f7f3ea" stroke="#9aa7b0" stroke-width="2" stroke-linejoin="round"/>

    <!-- body -->
    <ellipse cx="400" cy="245" rx="55" ry="38" fill="#fdfcf7" stroke="#9aa7b0" stroke-width="2.5"/>
    <path d="M352,262 Q400,288 448,258" stroke="#e6ddca" stroke-width="4" fill="none" opacity="0.8"/>

    <!-- scarf -->
    <path d="M448,220 C422,208 398,224 374,214" stroke="#e05555" stroke-width="7" fill="none" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M448,220 C422,208 398,224 374,214;
                M448,220 C420,216 400,200 370,212;
                M448,220 C422,208 398,224 374,214"/>
    </path>

    <!-- wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 402 250;-4 402 250;0 402 250;3 402 250;0 402 250"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <path d="M388,232 Q432,224 446,254 Q428,276 396,264 Q384,250 388,232 Z" fill="#b9c4cf" stroke="#8f9aa5" stroke-width="2"/>
      <path d="M398,246 Q420,242 434,256 M396,256 Q416,254 430,264" stroke="#8f9aa5" stroke-width="1.5" fill="none"/>
    </g>

    <!-- neck -->
    <path d="M438,222 Q470,192 505,186" stroke="#fdfcf7" stroke-width="15" fill="none" stroke-linecap="round"/>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 508 180;3 508 180;0 508 180;-2 508 180;0 508 180"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="508" cy="180" r="15" fill="#fdfcf7" stroke="#9aa7b0" stroke-width="2"/>
      <path d="M505,164 Q500,154 492,156 M509,163 Q508,152 515,153" stroke="#9aa7b0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="513" cy="174" r="4.5" fill="#ffffff"/>
      <ellipse cx="514.5" cy="174" rx="2.2" ry="2.2" fill="#222">
        <animate attributeName="ry" values="2.2;2.2;0.3;2.2" keyTimes="0;0.88;0.94;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M518,176 L594,197" stroke="#f2933d" stroke-width="5" stroke-linecap="round"/>
      <path d="M516,182 Q556,230 592,199 Q566,208 516,182 Z" fill="#f8a83a" stroke="#d97b23" stroke-width="1.5">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M516,182 Q556,230 592,199 Q566,208 516,182 Z;
                  M516,182 Q556,237 592,199 Q566,208 516,182 Z;
                  M516,182 Q556,230 592,199 Q566,208 516,182 Z"/>
      </path>
      <!-- a fish wriggling in the pouch -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 556 205;6 556 205;-6 556 205" dur="1s" repeatCount="indefinite"/>
        <ellipse cx="556" cy="205" rx="9" ry="4" fill="#8fa6b5"/>
        <path d="M565,205 L572,201 L572,209 Z" fill="#8fa6b5"/>
        <circle cx="551" cy="204" r="1.3" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>