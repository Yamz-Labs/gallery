<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Balls in a Spinning Hexagon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f1a; overflow: hidden; }
  canvas { display: block; margin: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width  = innerWidth;
  H = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// ---------- World parameters ----------
const GRAVITY     = 0.16;      // px/frame^2
const RESTITUTION = 0.94;      // bounciness (walls)
const BALL_RESTIT = 0.92;      // bounciness (ball-ball)
const SPIN_SPEED  = 0.006;     // rad/frame
const BALL_COUNT  = 10;
const RADIUS_MIN  = 10, RADIUS_MAX = 22;

const cx = () => W / 2;
const cy = () => H / 2;
const hexRadius = () => Math.min(W, H) * 0.42;

let angle = 0;
let spinDir = 1;

// ---------- Balls ----------
const balls = [];
for (let i = 0; i < BALL_COUNT; i++) {
  const r = RADIUS_MIN + Math.random() * (RADIUS_MAX - RADIUS_MIN);
  balls.push({
    x: cx() + (Math.random() - 0.5) * hexRadius() * 0.6,
    y: cy() + (Math.random() - 0.5) * hexRadius() * 0.6,
    vx: (Math.random() - 0.5) * 3,
    vy: (Math.random() - 0.5) * 3,
    r,
    hue: (i * 360 / BALL_COUNT + Math.random() * 30) % 360
  });
}

// ---------- Hexagon geometry ----------
// Returns vertices of the hexagon for the current angle.
function hexVertices() {
  const R = hexRadius(), a = angle, pts = [];
  for (let i = 0; i < 6; i++) {
    const t = a + i * Math.PI / 3;
    pts.push({ x: cx() + R * Math.cos(t), y: cy() + R * Math.sin(t) });
  }
  return pts;
}

// Closest point on segment (x1,y1)-(x2,y2) to point (px,py)
function closestPointOnSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return { x: x1 + t * dx, y: y1 + t * dy };
}

// ---------- Physics step ----------
function step() {
  angle += SPIN_SPEED * spinDir;
  const verts = hexVertices();

  for (const b of balls) {
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;

    // Collide with each wall (accounting for wall motion from rotation)
    for (let i = 0; i < 6; i++) {
      const p1 = verts[i], p2 = verts[(i + 1) % 6];
      const cp = closestPointOnSegment(b.x, b.y, p1.x, p1.y, p2.x, p2.y);
      let nx = b.x - cp.x, ny = b.y - cp.y;
      const dist = Math.hypot(nx, ny);

      if (dist < b.r) {
        // Normalize normal
        nx /= dist || 1; ny /= dist || 1;

        // Positional correction: push ball out along the normal
        const overlap = b.r - dist;
        b.x += nx * overlap;
        b.y += ny * overlap;

        // Wall point velocity (rotation about center):
        // v = omega x r  =>  (-omega*ry, omega*rx)
        const rx = cp.x - cx(), ry = cp.y - cy();
        const wallVx = -SPIN_SPEED * spinDir * ry;
        const wallVy =  SPIN_SPEED * spinDir * rx;

        // Relative velocity of ball vs. wall
        const relVx = b.vx - wallVx;
        const relVy = b.vy - wallVy;
        const vn = relVx * nx + relVy * ny; // normal component

        if (vn < 0) { // moving into the wall
          // Reflect the normal component with restitution,
          // keep tangential component (a bit of friction)
          const jn = -(1 + RESTITUTION) * vn;
          b.vx += jn * nx;
          b.vy += jn * ny;
          // slight tangential friction
          const tx = -ny, ty = nx;
          const vt = relVx * tx + relVy * ty;
          b.vx -= vt * 0.05 * tx;
          b.vy -= vt * 0.05 * ty;
        }
      }
    }
  }

  // Ball-ball collisions (equal-mass elastic impulses)
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if (dist < minDist && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = (minDist - dist) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;

        const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (relVn < 0) {
          const jn = -(1 + BALL_RESTIT) * relVn / 2;
          a.vx -= jn * nx; a.vy -= jn * ny;
          b.vx += jn * nx; b.vy += jn * ny;
        }
      }
    }
  }
}

// ---------- Rendering ----------
function draw() {
  // Motion-blur style clear
  ctx.fillStyle = 'rgba(13, 15, 26, 0.35)';
  ctx.fillRect(0, 0, W, H);

  const verts = hexVertices();

  // Hexagon
  ctx.save();
  ctx.translate(cx(), cy());
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const t = i * Math.PI / 3;
    const x = hexRadius() * Math.cos(t), y = hexRadius() * Math.sin(t);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(120, 200, 255, 0.9)';
  ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(120, 200, 255, 0.8)';
  ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.restore();

  // Balls with glow
  for (const b of balls) {
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6);
    grad.addColorStop(0, `hsla(${b.hue}, 90%, 75%, 1)`);
    grad.addColorStop(1, `hsla(${b.hue}, 90%, 55%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsl(${b.hue}, 90%, 65%)`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Loop ----------
function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Click / tap flips the spin direction
canvas.addEventListener('pointerdown', () => spinDir *= -1);
</script>
</body>
</html>
