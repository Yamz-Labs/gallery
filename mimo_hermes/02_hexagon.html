<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Balls in a Spinning Hexagon</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060a;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 13px;
    letter-spacing: 0.4px;
    user-select: none;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
  }
  #hud b { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>10 balls</b> bouncing inside a spinning hexagon &nbsp;·&nbsp; click to reshuffle &nbsp;·&nbsp; press R to restart</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const BALL_COUNT = 10;
  const HEX_SPIN = 0.55;            // rad/s, hexagon angular velocity
  const GRAVITY = 1100;             // px/s^2
  const RESTITUTION = 0.82;         // wall bounce
  const BALL_RESTITUTION = 0.9;     // ball-ball bounce
  const WALL_FRICTION = 0.94;       // tangential velocity retention on wall
  const DRAG = 0.12;                // air drag per second
  const MAX_SPEED = 1600;
  const SUBSTEPS = 4;
  const DT = 1 / 60;

  let W = 0, H = 0, CX = 0, CY = 0, R = 0;
  let theta = 0;                    // hexagon rotation angle
  let balls = [];

  // ---------- geometry helpers ----------
  const APOTHEM_FACTOR = Math.cos(Math.PI / 6); // sqrt(3)/2

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
    R = Math.min(W, H) * 0.4;
  }

  // Outward normal of edge i (edge i connects vertex i and vertex i+1)
  function edgeNormal(i, out) {
    const a = theta + i * (Math.PI / 3) + Math.PI / 6;
    out.x = Math.cos(a);
    out.y = Math.sin(a);
    return out;
  }

  function vertex(i, out) {
    const a = theta + i * (Math.PI / 3);
    out.x = CX + R * Math.cos(a);
    out.y = CY + R * Math.sin(a);
    return out;
  }

  function insideHex(x, y, margin) {
    const apothem = R * APOTHEM_FACTOR - margin;
    const dx = x - CX, dy = y - CY;
    for (let i = 0; i < 6; i++) {
      const a = theta + i * (Math.PI / 3) + Math.PI / 6;
      if (dx * Math.cos(a) + dy * Math.sin(a) > apothem) return false;
    }
    return true;
  }

  // ---------- setup ----------
  function spawnBalls() {
    balls = [];
    for (let i = 0; i < BALL_COUNT; i++) {
      let x, y, tries = 0;
      const r = 13 + Math.random() * 9;
      do {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.random() * (R * APOTHEM_FACTOR - r - 10);
        x = CX + Math.cos(ang) * rad;
        y = CY + Math.sin(ang) * rad;
        tries++;
      } while (!insideHex(x, y, r + 4) && tries < 200);

      const speed = 120 + Math.random() * 260;
      const dir = Math.random() * Math.PI * 2;
      balls.push({
        x, y, r,
        vx: Math.cos(dir) * speed,
        vy: Math.sin(dir) * speed,
        m: r * r,
        hue: (i * 36 + Math.random() * 20) % 360,
        spin: (Math.random() - 0.5) * 4,
        angle: Math.random() * Math.PI * 2,
        trail: []
      });
    }
  }

  // ---------- physics ----------
  const n = { x: 0, y: 0 };
  const v1 = { x: 0, y: 0 };

  function collideWalls(b) {
    const apothem = R * APOTHEM_FACTOR;
    for (let i = 0; i < 6; i++) {
      edgeNormal(i, n);
      const d = (b.x - CX) * n.x + (b.y - CY) * n.y - apothem;
      const penetration = d + b.r;
      if (penetration <= 0) continue;

      // Correct position: push ball back inside
      b.x -= n.x * penetration;
      b.y -= n.y * penetration;

      // Contact point on the wall
      const qx = b.x - n.x * d;
      const qy = b.y - n.y * d;

      // Wall velocity at contact point (rotation about center)
      const rx = qx - CX, ry = qy - CY;
      const ux = -HEX_SPIN * ry;
      const uy = HEX_SPIN * rx;

      // Relative velocity wrt wall
      let rvx = b.vx - ux;
      let rvy = b.vy - uy;
      const vn = rvx * n.x + rvy * n.y;
      if (vn > 0) {
        // Reflect normal component
        rvx -= (1 + RESTITUTION) * vn * n.x;
        rvy -= (1 + RESTITUTION) * vn * n.y;
        // Tangential friction
        const tx = -n.y, ty = n.x;
        const vt = rvx * tx + rvy * ty;
        const nvt = vt * WALL_FRICTION;
        const dv = nvt - vt;
        rvx += dv * tx;
        rvy += dv * ty;

        b.vx = ux + rvx;
        b.vy = uy + rvy;

        // Visual spin from tangential slip
        b.spin += (-vt / b.r) * 0.15;
      }
    }
  }

  function collideBalls() {
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const minDist = a.r + b.r;
        if (distSq >= minDist * minDist || distSq === 0) continue;

        const dist = Math.sqrt(distSq);
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;

        const im1 = 1 / a.m, im2 = 1 / b.m;
        const imSum = im1 + im2;

        // Position separation
        a.x -= nx * overlap * (im1 / imSum);
        a.y -= ny * overlap * (im1 / imSum);
        b.x += nx * overlap * (im2 / imSum);
        b.y += ny * overlap * (im2 / imSum);

        // Impulse
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jImp = -(1 + BALL_RESTITUTION) * vn / imSum;
          a.vx -= jImp * nx * im1;
          a.vy -= jImp * ny * im1;
          b.vx += jImp * nx * im2;
          b.vy += jImp * ny * im2;
        }
      }
    }
  }

  function step(dt) {
    theta += HEX_SPIN * dt;

    for (const b of balls) {
      b.vy += GRAVITY * dt;
      const dragK = Math.max(0, 1 - DRAG * dt);
      b.vx *= dragK;
      b.vy *= dragK;

      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPEED) {
        b.vx *= MAX_SPEED / sp;
        b.vy *= MAX_SPEED / sp;
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.angle += b.spin * dt;
      b.spin *= 1 - 0.6 * dt;
    }

    for (let k = 0; k < 2; k++) {
      for (const b of balls) collideWalls(b);
      collideBalls();
    }

    // Safety: keep balls inside the hexagon no matter what
    for (const b of balls) {
      if (!insideHex(b.x, b.y, b.r)) {
        b.x += (CX - b.x) * 0.3;
        b.y += (CY - b.y) * 0.3;
        b.vx *= 0.5;
        b.vy *= 0.5;
      }
    }
  }

  // ---------- rendering ----------
  function drawHexagon() {
    const v = [{ x: 0, y: 0 }, { x: 0, y: 0 }];

    // Fill
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      vertex(i, v[0]);
      if (i === 0) ctx.moveTo(v[0].x, v[0].y);
      else ctx.lineTo(v[0].x, v[0].y);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(120, 160, 255, 0.05)";
    ctx.fill();

    // Faint spokes to show the spin
    ctx.save();
    ctx.strokeStyle = "rgba(140, 170, 255, 0.10)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      vertex(i, v[0]);
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(v[0].x, v[0].y);
      ctx.stroke();
    }
    ctx.restore();

    // Edges with per-edge gradient + glow
    ctx.save();
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.shadowBlur = 18;
    for (let i = 0; i < 6; i++) {
      const a1 = theta + i * (Math.PI / 3);
      const a2 = theta + (i + 1) * (Math.PI / 3);
      const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
      const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);
      const hue = (i * 60 + theta * 57.3 * 0.5) % 360;
      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, `hsla(${hue}, 90%, 65%, 1)`);
      grad.addColorStop(1, `hsla(${(hue + 60) % 360}, 90%, 65%, 1)`);
      ctx.strokeStyle = grad;
      ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.8)`;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.restore();

    // Vertex dots
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    for (let i = 0; i < 6; i++) {
      vertex(i, v[0]);
      ctx.beginPath();
      ctx.arc(v[0].x, v[0].y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBalls() {
    for (const b of balls) {
      // Trail
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 10) b.trail.shift();
      for (let i = 0; i < b.trail.length - 1; i++) {
        const t = b.trail[i];
        const a = (i / b.trail.length) * 0.18;
        ctx.fillStyle = `hsla(${b.hue}, 90%, 60%, ${a})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * (0.4 + 0.6 * (i / b.trail.length)), 0, Math.PI * 2);
        ctx.fill();
      }

      // Body
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, `hsl(${b.hue}, 95%, 85%)`);
      grad.addColorStop(0.5, `hsl(${b.hue}, 90%, 60%)`);
      grad.addColorStop(1, `hsl(${b.hue}, 85%, 35%)`);

      ctx.save();
      ctx.shadowBlur = 16;
      ctx.shadowColor = `hsla(${b.hue}, 95%, 55%, 0.85)`;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Rotation marker so the spin is visible
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-b.r * 0.7, 0);
      ctx.lineTo(b.r * 0.7, 0);
      ctx.stroke();
      ctx.restore();

      // Highlight
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    // Background
    const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.7);
    bg.addColorStop(0, "#0b1020");
    bg.addColorStop(1, "#05060a");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawHexagon();
    drawBalls();
  }

  // ---------- main loop ----------
  let last = performance.now();
  let acc = 0;

  function frame(now) {
    let elapsed = (now - last) / 1000;
    last = now;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;

    while (acc >= DT) {
      const sdt = DT / SUBSTEPS;
      for (let s = 0; s < SUBSTEPS; s++) step(sdt);
      acc -= DT;
    }

    render();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  window.addEventListener("resize", resize);
  window.addEventListener("pointerdown", () => {
    for (const b of balls) {
      const sp = 150 + Math.random() * 350;
      const dir = Math.random() * Math.PI * 2;
      b.vx = Math.cos(dir) * sp;
      b.vy = Math.sin(dir) * sp;
      b.trail.length = 0;
    }
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") {
      theta = 0;
      spawnBalls();
    }
  });

  resize();
  spawnBalls();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
