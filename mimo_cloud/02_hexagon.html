<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Balls in Spinning Hexagon</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center;
         height: 100vh; background: #0f0f1a; overflow: hidden; }
  canvas { box-shadow: 0 0 60px rgba(80,120,255,0.15); border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width = 860;
canvas.height = 620;

// --- constants ---
const CX       = canvas.width  / 2;
const CY       = canvas.height / 2;
const HEX_R    = 260;
const HEX_SPIN = 0.006;            // rad / frame
const N_BALLS  = 10;
const BALL_R   = 17;
const GRAVITY  = 0;                // zero gravity for pure bouncing
const RESTIT   = 0.95;             // slight energy loss so it settles nicely

const PALETTE = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6b9d',
                 '#c084fc','#fb923c','#22d3ee','#a3e635','#f472b6'];

// --- ball init ---
let hexAngle = 0;
const balls = [];
for (let i = 0; i < N_BALLS; i++) {
  const a   = (i / N_BALLS) * Math.PI * 2;
  const d   = 40 + Math.random() * 70;
  balls.push({
    x: CX + Math.cos(a) * d,
    y: CY + Math.sin(a) * d,
    vx: (Math.random() - 0.5) * 12,
    vy: (Math.random() - 0.5) * 12,
    r: BALL_R,
    col: PALETTE[i],
    trail: []
  });
}

// --- hex geometry helpers ---
function hexVerts(angle) {
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = angle + i * Math.PI / 3;
    v.push({ x: CX + Math.cos(a) * HEX_R, y: CY + Math.sin(a) * HEX_R });
  }
  return v;
}

function hexEdges(verts) {
  const e = [];
  for (let i = 0; i < 6; i++) {
    const v1 = verts[i], v2 = verts[(i + 1) % 6];
    const dx = v2.x - v1.x, dy = v2.y - v1.y;
    const len = Math.hypot(dx, dy);
    const tx = dx / len, ty = dy / len;
    let nx = -ty, ny = tx;
    // force normal to point inward (toward centre)
    const mx = (v1.x + v2.x) / 2 - CX;
    const my = (v1.y + v2.y) / 2 - CY;
    if (nx * mx + ny * my > 0) { nx = -nx; ny = -ny; }
    e.push({ v1, v2, nx, ny });
  }
  return e;
}

// --- collisions ---
function collideBalls() {
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const min  = a.r + b.r;
      if (dist < min && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = min - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;
        const dvn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (dvn > 0) {
          a.vx -= dvn * nx * RESTIT;
          a.vy -= dvn * ny * RESTIT;
          b.vx += dvn * nx * RESTIT;
          b.vy += dvn * ny * RESTIT;
        }
      }
    }
  }
}

function collideHex(edges) {
  for (const ball of balls) {
    for (const ed of edges) {
      const sd = (ball.x - ed.v1.x) * ed.nx + (ball.y - ed.v1.y) * ed.ny;
      if (sd < ball.r) {
        // push ball back inside
        ball.x += ed.nx * (ball.r - sd);
        ball.y += ed.ny * (ball.r - sd);

        // wall velocity due to spin: v = ω × r
        const rx = ball.x - CX, ry = ball.y - CY;
        const wallVx = -HEX_SPIN * ry;
        const wallVy =  HEX_SPIN * rx;

        // reflect relative velocity
        const relN = (ball.vx - wallVx) * ed.nx + (ball.vy - wallVy) * ed.ny;
        if (relN < 0) {
          ball.vx -= 2 * relN * ed.nx * RESTIT;
          ball.vy -= 2 * relN * ed.ny * RESTIT;
        }
      }
    }
  }
}

// --- update ---
function update() {
  hexAngle += HEX_SPIN;
  const edges = hexEdges(hexVerts(hexAngle));

  for (const b of balls) {
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;
    // store trail
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 18) b.trail.shift();
  }

  collideBalls();
  collideHex(edges);
  collideBalls();
  collideHex(edges);
}

// --- draw ---
function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const verts = hexVerts(hexAngle);

  // --- hexagon background ---
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, HEX_R);
  grad.addColorStop(0, 'rgba(30,40,80,0.4)');
  grad.addColorStop(1, 'rgba(15,25,50,0.1)');
  ctx.fillStyle = grad;
  ctx.fill();

  // --- hexagon outer glow ---
  ctx.save();
  ctx.shadowColor = 'rgba(100,180,255,0.6)';
  ctx.shadowBlur  = 25;
  ctx.strokeStyle  = 'rgba(180,220,255,0.8)';
  ctx.lineWidth    = 3;
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  // --- vertex dots ---
  for (const v of verts) {
    ctx.beginPath();
    ctx.arc(v.x, v.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  // --- trails ---
  for (const b of balls) {
    for (let i = 1; i < b.trail.length; i++) {
      const t = i / b.trail.length;
      ctx.beginPath();
      ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
      ctx.lineTo(b.trail[i].x, b.trail[i].y);
      ctx.strokeStyle = b.col;
      ctx.globalAlpha = t * 0.3;
      ctx.lineWidth   = b.r * t;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // --- balls ---
  for (const b of balls) {
    // glow
    ctx.save();
    ctx.shadowColor = b.col;
    ctx.shadowBlur  = 18;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.col;
    ctx.fill();
    ctx.restore();

    // highlight
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();
  }

  // --- HUD ---
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('10 balls · spinning hexagon', 14, canvas.height - 14);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
